<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09121c"><title>THE 09:17 INCIDENT — Prototype</title>
<style>
:root{color-scheme:dark;--ink:#e9e7df;--muted:#a5b5c2;--amber:#f2bb70;--line:#455363;--paper:#ded7c8}*{box-sizing:border-box}body{margin:0;background:#08111b;color:var(--ink);font:16px/1.55 system-ui,sans-serif}button{font:inherit;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}main{min-height:100dvh;background:radial-gradient(ellipse at 70% 25%,#213347,transparent 55%),#08111b;padding:20px}.shell{max-width:1050px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #526273;padding:12px 0;gap:15px}.logo{font-weight:900;letter-spacing:.13em}.tag{font:700 11px system-ui;letter-spacing:.13em;color:var(--amber)}h1,h2{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.015em;line-height:1}h1{font-size:clamp(58px,10vw,120px);margin:20px 0}h2{font-size:clamp(35px,6vw,65px);margin:12px 0 25px}.intro{min-height:70vh;display:flex;flex-direction:column;justify-content:center;max-width:750px}.lead{font-size:clamp(20px,2.7vw,28px);max-width:650px}.muted{color:var(--muted)}.btn{background:var(--amber);border:0;border-radius:4px;padding:14px 25px;color:#1b2228;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.btn:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#192a39;color:var(--ink);border:1px solid #697b8b;padding:13px 19px;border-radius:4px}.row{display:flex;gap:12px;flex-wrap:wrap}.stage{padding:55px 0}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;color:var(--amber)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:25px}.paper{background:var(--paper);color:#24313c;box-shadow:12px 15px 0 #03080d60;transform:rotate(-.6deg);padding:clamp(20px,4vw,42px);min-height:340px}.paper small{letter-spacing:.14em;font-weight:800}.paper h3{font-size:clamp(26px,4vw,44px);line-height:1.1;margin:22px 0}.paper p{font-size:17px}.redact{background:#27343f;color:#fff;padding:2px 7px}.panel{border:1px solid var(--line);background:#101e2b;padding:25px}.panel h3{margin:0 0 15px;font-size:21px}.evidence{display:block;width:100%;text-align:left;background:#172c3d;color:var(--ink);border:1px solid #52667a;margin:10px 0;padding:16px}.evidence[aria-pressed=true]{border-color:var(--amber);background:#333129}.evidence strong{display:block}.evidence small{display:block;color:#a8bdc9;margin-top:5px}.choice{display:block;width:100%;text-align:left;background:#132434;border:1px solid #4c6073;padding:20px;color:var(--ink);margin:12px 0}.choice:hover,.evidence:hover{border-color:var(--amber)}.choice[aria-pressed=true]{background:#352c25;border-color:var(--amber)}.choice strong{display:block;font-size:19px}.choice p{color:#becbd4;margin:7px 0}.choice small{color:var(--amber)}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #4b5b6a;padding:12px 0}.stat strong{font-variant-numeric:tabular-nums}.signal{font-size:clamp(28px,4vw,45px);color:var(--amber);font-weight:900}.foot{margin-top:30px;color:#9bafc1;font-size:12px}.hidden{display:none}.consequence{border-left:4px solid var(--amber);padding:15px 22px;background:#1e2b35;margin:22px 0}.hint{font-size:14px;color:#d0dfeb}@media(max-width:700px){.grid{grid-template-columns:1fr}.stage{padding:30px 0}.top{align-items:flex-start}.paper{min-height:0}.panel{padding:17px}}@media(prefers-reduced-motion:no-preference){.stage{animation:enter .4s ease-out}@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}}
</style>
<main><div class="shell"><header class="top"><div class="logo">BUSINESS CRISIS <span class="tag">/ PROTOTYPE</span></div><div class="tag" id="step">DIRECTOR'S CUT · VERTICAL SLICE</div></header><div id="screen" aria-live="polite"></div><footer class="foot">Prototype only · Separate from the live six-episode game · Illustrative simulation values, not financial advice</footer></div></main>
<script type="module">
const root=document.querySelector('#screen'),step=document.querySelector('#step');let phase=0,seen=new Set(),intel=[],choice=null;
const docs=[
{title:'THE LEAK',subtitle:'External email · 09:17',body:'A confidential renewal pricing sheet has reached the client. The sender is unknown. The client has requested an explanation before noon.',clue:'The attachment was exported at 08:52 from an internal shared folder.'},
{title:'OPERATIONS LOG',subtitle:'Internal record · 09:06',body:'An account manager approved temporary contractor access yesterday to meet a delivery deadline. The access was meant to expire overnight.',clue:'The contractor account remained active at 09:12.'},
{title:'CLIENT MESSAGE',subtitle:'Account correspondence · 09:21',body:'The client has paused a scheduled meeting and is considering whether to notify its own procurement team.',clue:'The client asks for a factual response, not an admission of fault.'}
];
const advisors=[
{name:'Legal counsel',short:'Preserve privilege and evidence',detail:'Do not allege a culprit. Preserve access logs, suspend risky access through normal procedure, and avoid promising the client that exposure is contained before verifying scope.'},
{name:'Operations director',short:'Protect delivery continuity',detail:'Contractor access may have supported a time-critical delivery. Removing it without a handover risks missing tomorrow’s service window.'},
{name:'Client lead',short:'Understand the renewal pressure',detail:'The client values prompt acknowledgement, but an unverified public statement could escalate procurement scrutiny.'},
{name:'Finance controller',short:'Quantify immediate liquidity',detail:'A forensic review can cost £18k; a rushed operational shutdown could incur £28k in disruption and recovery expenses.'},
{name:'Security analyst',short:'Trace the access window',detail:'The export timestamp and active contractor account are leads, not proof of responsibility. Access and sharing logs must be correlated.'},
{name:'People director',short:'Contain internal speculation',detail:'A public accusation against a worker before investigation may damage retention and create employment-law exposure.'}
];
const strategies=[
{name:'Quiet containment',desc:'Suspend external sharing, preserve logs, contact the client privately, and commission a targeted investigation.',good:'Limits further access; keeps the client informed.',cost:'£18k investigation cost; delivery may slow.',spend:18000,risk:39,trust:66,outcome:'The client receives a measured update. Your investigation begins, but the next delivery window is now under pressure.'},
{name:'Immediate full shutdown',desc:'Freeze all contractor access and external exports; brief the client on a major security response.',good:'Rapidly narrows exposure; signals decisive control.',cost:'£28k disruption cost; service continuity deteriorates.',spend:28000,risk:31,trust:54,outcome:'Access is cut quickly. The client appreciates urgency but now asks why a planned delivery is slipping.'},
{name:'Client-first disclosure',desc:'Call the client immediately, share verified facts, and keep delivery running while an investigation starts.',good:'Protects the relationship; maintains operational flow.',cost:'£12k initial response; unresolved access remains a risk.',spend:12000,risk:58,trust:76,outcome:'The client welcomes the direct call. Meanwhile, investigators warn that the source of the leak is still open.'}
];
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(n){phase=n;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){step.textContent=['01 / THE CALL','02 / EVIDENCE','03 / INTELLIGENCE','04 / THE DECISION','05 / CONSEQUENCES'][phase];
if(phase===0)root.innerHTML='<section class="intro stage"><div class="eyebrow">09:17 AM · MONDAY · INTERNAL PRIORITY ONE</div><h1>THE <span style="color:var(--amber)">09:17</span><br>INCIDENT</h1><p class="lead">A confidential pricing document has leaked. Your most important client is asking questions. The board wants answers before noon.</p><p class="muted">You have one crisis, incomplete information and £260,000 in emergency response funds. What you do now will follow you.</p><div><button class="btn" id="start">Open incident file →</button></div></section>';
if(phase===1)root.innerHTML='<section class="stage"><div class="eyebrow">EVIDENCE ROOM / THREE EXHIBITS</div><h2>Read before you react.</h2><div class="grid"><div class="paper" id="document"><small>RESTRICTED · INTERNAL</small><h3>INCIDENT REPORT 0917</h3><p>Select an exhibit to inspect the evidence.</p><p><span class="redact">SOURCE UNKNOWN</span></p></div><div class="panel"><h3>Evidence locker</h3>'+docs.map((d,i)=>'<button class="evidence" data-doc="'+i+'" aria-pressed="'+seen.has(i)+'"><strong>0'+(i+1)+' / '+escape(d.title)+'</strong><small>'+escape(d.subtitle)+'</small></button>').join('')+'<p class="hint">Inspect all three exhibits before requesting advice.</p><button class="btn" id="next" '+(seen.size<3?'disabled':'')+'>Consult specialists →</button></div></div></section>';
if(phase===2)root.innerHTML='<section class="stage"><div class="eyebrow">CONFIDENTIAL INTELLIGENCE / TWO CHANNELS</div><h2>Who do you trust?</h2><p class="lead">Choose exactly two advisers. Their briefings remain sealed until you confirm. The other four will not be available for this decision.</p><div class="grid"><div class="panel">'+advisors.map((a,i)=>'<button class="evidence" data-advisor="'+i+'" aria-pressed="'+intel.includes(i)+'"><strong>'+escape(a.name)+'</strong><small>'+escape(a.short)+'</small></button>').join('')+'</div><div class="panel"><div class="eyebrow">INTELLIGENCE ALLOCATION</div><div class="signal">'+intel.length+' / 2</div><p>Selections can be changed until confirmation.</p><p class="muted">All teams face the same scenario. Different sources reveal different risks.</p><button class="btn" id="confirm" '+(intel.length!==2?'disabled':'')+'>Unlock selected intelligence →</button></div></div></section>';
if(phase===3)root.innerHTML='<section class="stage"><div class="eyebrow">DECISION WINDOW / 11:00 DEADLINE</div><h2>The board is waiting.</h2><div class="grid"><div><div class="panel"><h3>Private specialist briefings</h3>'+intel.map(i=>'<div class="consequence"><div class="eyebrow">'+escape(advisors[i].name)+'</div><p>'+escape(advisors[i].detail)+'</p></div>').join('')+'</div><h3 style="margin-top:35px">Choose your response</h3>'+strategies.map((s,i)=>'<button class="choice" data-choice="'+i+'" aria-pressed="'+(choice===i)+'"><strong>'+String.fromCharCode(65+i)+' · '+escape(s.name)+'</strong><p>'+escape(s.desc)+'</p><small>ADVANTAGES: '+escape(s.good)+'<br>TRADE-OFF: '+escape(s.cost)+'</small></button>').join('')+'</div><aside class="panel"><h3>Response authority</h3><div class="stat"><span>Emergency cash</span><strong>£260,000</strong></div><div class="stat"><span>Client renewal</span><strong>£240,000 / year</strong></div><div class="stat"><span>Incident status</span><strong>Unresolved</strong></div><p class="hint">This is a consequential choice. It cannot be undone after confirmation.</p><button class="btn" id="commit" '+(choice===null?'disabled':'')+'>Commit board response →</button></aside></div></section>';
if(phase===4){let s=strategies[choice];root.innerHTML='<section class="stage"><div class="eyebrow">11:42 AM / CONSEQUENCE REPORT</div><h2>Your decision has consequences.</h2><div class="consequence"><h3>'+escape(s.name)+'</h3><p class="lead">'+escape(s.outcome)+'</p></div><div class="grid"><div class="panel"><h3>Response ledger</h3><div class="stat"><span>Opening response fund</span><strong>£260,000</strong></div><div class="stat"><span>Committed response costs</span><strong>−£'+s.spend.toLocaleString('en-GB')+'</strong></div><div class="stat"><span>Remaining emergency cash</span><strong>£'+(260000-s.spend).toLocaleString('en-GB')+'</strong></div><p class="muted">The £240,000 annual renewal is potential contract value, not available cash.</p></div><div class="panel"><h3>Boardroom indicators</h3><div class="stat"><span>Illustrative exposure</span><strong>'+s.risk+' / 100</strong></div><div class="stat"><span>Illustrative client confidence</span><strong>'+s.trust+' / 100</strong></div><p>Neither metric guarantees success. The incident remains unresolved, and the next episode would test your earlier commitment.</p></div></div><div class="row" style="margin-top:28px"><button class="btn" id="replay">Replay alternative strategy</button><a class="ghost" href="./index.html">Restart prototype</a></div></section>'}}
root.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='start')go(1);if(b.dataset.doc!==undefined){let i=+b.dataset.doc;seen.add(i);render();document.querySelector('#document').innerHTML='<small>'+escape(docs[i].subtitle)+' · EVIDENCE 0'+(i+1)+'</small><h3>'+escape(docs[i].title)+'</h3><p>'+escape(docs[i].body)+'</p><p><strong>KEY FINDING</strong><br>'+escape(docs[i].clue)+'</p>';document.querySelector('[data-doc="'+i+'"]').focus()}if(b.id==='next')go(2);if(b.dataset.advisor!==undefined){let i=+b.dataset.advisor;if(intel.includes(i))intel=intel.filter(x=>x!==i);else if(intel.length<2)intel.push(i);render();document.querySelector('[data-advisor="'+i+'"]').focus()}if(b.id==='confirm'&&intel.length===2)go(3);if(b.dataset.choice!==undefined){choice=+b.dataset.choice;render();document.querySelector('[data-choice="'+choice+'"]').focus()}if(b.id==='commit'&&choice!==null)go(4);if(b.id==='replay'){choice=null;go(3)}};render();
</script></html>
