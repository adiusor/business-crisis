.cinema-content{position:relative;max-width:665px;padding:72px 44px 90px;z-index:1}.cinema-series{font-size:11px;letter-spacing:.18em;font-weight:800;color:#fad6a7;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.signal-dot{width:9px;height:9px;background:#ee7458;border-radius:50%;box-shadow:0 0 0 5px #ed7b452b}.series-id{display:inline-block;padding:5px 9px;background:#ffffff13;border:1px solid #c4d4eb38;border-radius:4px;color:#d4e7f9;letter-spacing:.12em}
.cinema-logo{font:900 clamp(77px,9.7vw,135px)/.72 var(--display);letter-spacing:-.045em;margin:40px 0 22px;filter:drop-shadow(0 7px 6px #000b)}.cinema-logo span,.cinema-logo em{display:block}.cinema-logo span{color:#fcf8ef;text-shadow:0 4px 0 #59616a,0 9px 9px #050912}.cinema-logo em{font-style:italic;color:#ffb144;text-shadow:0 4px 0 #8b411c,0 8px 18px #0b1024;transform:skew(-5deg);margin-left:21px}
.cinema-rule{background:linear-gradient(90deg,#ffa74d,transparent);height:2px;width:310px;margin:25px 0}.cinema-tagline{font:900 clamp(31px,3.8vw,50px)/.98 var(--display);letter-spacing:.04em;color:#fff6e7}.cinema-desc{font-size:17px;line-height:1.58;max-width:500px;color:#dce6ee;margin:16px 0}.cinema-meta{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 21px}.cinema-meta span{color:#e6e9ed;border:1px solid #72859b8c;padding:7px 9px;border-radius:5px;background:#0b1d32ac;font-size:11px;font-weight:800;letter-spacing:.08em}.cinema-cta{min-width:290px}.cinema-fine{font-size:12px;color:#b5c3d0;margin:20px 0 0}
.cinema-bottom{position:absolute;bottom:0;left:0;right:0;min-height:48px;background:#04111de8;border-top:1px solid #ffffff31;display:flex;align-items:center;gap:16px;padding:11px 18px;z-index:2;white-space:nowrap;overflow:hidden}.red-led{color:#ffb5a8;background:#8d2e25b3;border:1px solid #ee726270;padding:6px 8px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.08em}.cinema-news{overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.13em;color:#ccdceb}.cinema-news span{color:#f6af51;margin:0 12px}.cinema-clock{margin-left:auto;color:#ffbd71;font:800 19px var(--display);letter-spacing:.08em}
.premise-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:20px 0 35px;border:1px solid #405872;border-radius:14px;overflow:hidden;background:linear-gradient(115deg,#102135,#0b1725)}.premise-strip div{padding:21px 20px;border-right:1px solid #405872}.premise-strip div:last-child{border-right:0}.premise-strip b{display:block;color:#ffbc74;font:800 16px var(--display);letter-spacing:.07em}.premise-strip span{display:block;color:#cad4df;font-size:13px;margin-top:4px}
/* Lobby: bold gameshow headers, tactile controls, blue vs red teams */
.screen{padding-top:35px}.heading h1{font-size:clamp(55px,6.6vw,92px);text-shadow:0 7px 19px #0007}.heading p{font-size:19px;color:#e0e6ee}.panel{background:linear-gradient(155deg,#16283e,#101c2c 79%);border-color:#425b75;border-radius:18px;box-shadow:0 16px 38px #0005;padding:26px}.panel h2{font-size:36px;letter-spacing:.018em}.panel h3{font-size:26px}.panel p{font-size:15px;color:#dbe5ef}.field{background:#09192b;border-color:#56708b;border-radius:9px;padding:13px;font-size:15px}.fieldLabel{font-size:12px;color:#c9d9e6}.controlrow .field{margin:4px 0}.xbtn{background:#253a50}.roundtag{border-color:#f3b35c88;background:#1d2b38;box-shadow:inset 0 0 21px #f4b34d10}
.team{position:relative;padding:18px;border:1px solid #47759d;background:linear-gradient(146deg,#142b47,#081928);border-radius:13px;box-shadow:inset 4px 0 0 #589cdd}.team:nth-child(2n){border-color:#985458;background:linear-gradient(146deg,#3a1d2e,#191628);box-shadow:inset 4px 0 0 #d86979}.team:nth-child(3n){border-color:#729e73;box-shadow:inset 4px 0 0 #75bd96}.team:nth-child(4n){border-color:#866f9c;box-shadow:inset 4px 0 0 #a28ad4}.team b{font-size:17px}.team select{color:#f1f8ff}.member{border:1px solid #7e9ab44a;background:#223c55}.hotnote{background:#273143;color:#e6e3dc;border-left:3px solid #f5b46a}
/* Cinematic mission screen, clear and explicit budgets. */
.mission-head{padding:38px 0 26px;background:linear-gradient(90deg,#102339,#172c42,#071420);border-bottom:2px solid #f1aa526b;margin-bottom:22px;border-radius:14px;padding-left:25px}.mission-head h1{font:900 clamp(53px,6.7vw,95px)/.88 var(--display);letter-spacing:-.015em;margin:14px 0}.mission-head h1 em{font-style:normal;color:#f4b455}.mission-head>p{font-size:19px;line-height:1.48;max-width:800px;color:#e1e9f2;margin:0}.mission-layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);gap:18px}.mission-story{min-height:480px}.mission-story h2{font-size:clamp(32px,3.1vw,46px)}.mission-story .mission-large{font-size:20px;line-height:1.56;color:#eef4f8}.mission-steps{font-size:16px;line-height:1.65}.mission-steps li{margin:11px 0}.mission-caveat{border-top:1px solid #49607c;color:#9db4c7;padding-top:18px;margin-top:22px;font-size:12px}.mission-finance{display:grid;gap:14px}.budget-card,.contract-card,.mission-launch{border:1px solid #4b6480;border-radius:16px;padding:22px;background:#12263a}.budget-card{background:linear-gradient(135deg,#26331f,#15283a);border-color:#b58a3c}.contract-card{background:linear-gradient(135deg,#332133,#162438);border-color:#bc7288}.budget-card strong,.contract-card strong{display:block;font:900 64px/.9 var(--display);margin:12px 0;color:#f4be72}.contract-card strong{color:#fac2d0}.contract-card strong span{font-size:22px}.budget-card b,.contract-card b{display:block;font-size:12px;letter-spacing:.15em}.budget-card p,.contract-card p{color:#d6e4ed;font-size:14px;line-height:1.48}.mission-launch p{font-size:14px}

/* Advisor roster — consistent portraits, correct gender/name pairing and sealed consultations. */
.roles{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.role{border-radius:14px;border:1px solid #405b76;min-height:215px;box-shadow:0 10px 18px #0005;transition:transform .18s,border-color .18s,box-shadow .18s}.role:hover:not(:disabled){transform:translateY(-3px);border-color:#ffce8b;box-shadow:0 13px 25px #0008}.rolephoto{height:167px;background-color:#1e334b;background-size:cover;background-position:center 18%;filter:saturate(.94)}.rolefoot{min-height:69px;padding:11px;background:linear-gradient(180deg,#142538,#101b2a)}.rolename{font:900 19px/.96 var(--display);letter-spacing:.025em;color:#f5f5f2}.rolerole{font-size:11px;color:#b2c8d8;margin-top:4px}.role.picked{border:2px solid #ffd17a;box-shadow:0 0 0 2px #ffd17a2b,0 0 31px #c9933670}.selectMark{background:#f1ad4c;color:#132239;font-weight:900;letter-spacing:.07em}.role.locked{opacity:.62}.intel{border:1px solid #79a0b4;background:linear-gradient(130deg,#1b3647,#102231);font-size:15px;line-height:1.65}.intel b{font-size:17px;color:#ffcf82}
/* Tactical choice cards: cream panels contrast with dramatic dark playfield. */
.decision-intro{padding:12px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#eaf0fa}.decision-intro b{color:#fbc57a}.decision-intro span{font-size:13px;color:#b8cbd8}.decision-grid,.allocation-grid,.casefile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:14px 0 7px}.decision-grid .choice,.casefile-grid .choice{margin:0;min-height:148px;position:relative;display:flex;flex-direction:column;gap:10px;border:1px solid #e3ceae;border-radius:13px;background:linear-gradient(145deg,#fff4de,#e9ded0);color:#1d3041;padding:15px;box-shadow:0 6px 0 #907a61,0 12px 18px #0005}.decision-grid .choice:hover:not(:disabled),.casefile-grid .choice:hover:not(:disabled){background:linear-gradient(145deg,#fff9eb,#fff0d6);border-color:#ffb952;transform:translateY(-2px)}.decision-grid .choice.picked,.casefile-grid .choice.picked{background:#fff0ce;outline:3px solid #f5b45c;outline-offset:-3px;border-color:#c38d38;box-shadow:0 5px 0 #b18044}.decision-grid .choice .letter,.casefile-grid .choice .letter{font:900 21px var(--display);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#ffc16d;color:#19283a;flex-shrink:0;box-shadow:0 2px 0 #bb8751}.decision-grid .choice strong,.casefile-grid .choice strong{font:900 23px/1.08 var(--display);color:#172839;letter-spacing:.012em}.decision-grid .choice small,.casefile-grid .choice small{font:500 13px/1.4 var(--body);color:#43515b;margin-top:5px}.choice-body{display:flex;flex-direction:column;flex:1}.decision-grid .choice em{font:800 10px/1.5 var(--body);font-style:normal;color:#79542b;margin-top:auto;padding-top:10px;border-top:1px solid #cab7a0;letter-spacing:.03em}.decision-grid .choice .tick{position:absolute;right:13px;top:12px;color:#153b34}.casefile-head{font:900 25px var(--display);color:#ffc680;letter-spacing:.08em}.casefile-grid .choice{min-height:120px}.details{border:1px solid #54708b;border-radius:10px;background:#112b43;padding:15px;display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:108px}.details strong{font-size:15px}.details .cost{color:#fbc574;font-size:12px;font-weight:800;margin-top:5px}.counter button{border-radius:8px;min-width:38px;min-height:38px;border:1px solid #69849e;color:white;background:#2c4057}.counter button:hover{background:#445a71}
/* Big reveal and rival comparison: scoreboard first, case studies on demand. */
.verdictTop{padding-top:40px;background:linear-gradient(150deg,#10283e,#081726 75%);border:1px solid #4c6380;border-radius:20px;padding:28px;margin-top:25px}.verdictDisplay{font-size:clamp(80px,11vw,155px);text-shadow:0 7px 18px #0009}.championReveal{border:2px solid #d6a35a;background:linear-gradient(120deg,#473424,#102941 80%);box-shadow:0 0 24px #fbbf6535,0 18px 45px #0006}.champName{font-size:clamp(45px,6vw,86px)}.championReveal:before{content:'★';font-size:37px;color:#ffd08c;position:absolute;right:14px;top:8px;text-shadow:0 0 20px #ffb54a50}.championReveal{position:relative}.champScore b{color:#ffd48d}.rivalry{background:linear-gradient(120deg,#182b42,#101d2d);border-color:#5b7591}.rivalry th,.rivalry td{font-size:13px}.rivalry thead th{color:#ffd396}.resultHero{border-color:#58718c;background:linear-gradient(125deg,#192f49,#111e2d)}.resultHero.victor{border-color:#e2b36a;background:linear-gradient(115deg,#342d25,#152e47)}.resultNumber{font-size:clamp(65px,7vw,95px);color:#ffd186}.resultHeadlines{gap:7px}.tapeBody h4{font-size:26px}.tapeCash span{font-size:12px}.tapeInsight{font-size:11px}.resultTicker{border-left:3px solid #f9b96c;background:#503a2457}.dossier[open] .dossierBody{animation:rise .22s ease-out}@keyframes rise{from{opacity:.65;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Layout safety / motion / accessibility */

{title:'THE BOARDROOM VERDICT',time:'FRI 16:30',story:'The board needs an actionable recovery package. Your company is bruised, cash is finite and some risks from earlier decisions are still unresolved. There is no universally optimal final plan.',quote:'CEO: “Excellent recovery meeting. Could we have fewer surprises next week?”',kind:'choice',question:'Where will you place the company’s recovery bet?',options:[

function recomputeRisk(t){const m=t.m,p=t.pressure||{},f=t.flags;
 const legal=clamp(83-m.evidence*.56+(f.investigation==='preserve'?11:0)+(f.investigation==='external'?-6:0)+(p.legal||0),9,98);

function choices(t,r){if(r.kind==='allocate'){const used=sum(S.alloc);return `<div class="decision-intro"><b>YOUR ALLOCATION / ${used} OF 5 UNITS</b><span>Maximum two units per department. Each unit reserves funding from the 90-day plan.</span></div><div class="allocation-grid">${departments.map(d=>`<div class="details"><div><strong>${X(d.name)}</strong><div class="tiny">${X(d.detail)}</div><div class="cost">£${d.cost}k / unit</div></div><div class="counter"><button data-budget="${d.id}" data-inc="-1" aria-label="Remove one unit from ${X(d.name)}">−</button><b>${S.alloc[d.id]||0}</b><button data-budget="${d.id}" data-inc="1" aria-label="Add one unit to ${X(d.name)}">+</button></div></div>`).join('')}</div>`;}

return docs+`<div class="decision-grid">${r.options.map((o,i)=>`<button class="choice ${S.choice===i?'picked':''}" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="choice-body"><strong>${X(o[0])}</strong><small>${X(o[1])}</small><em>INITIAL COMMITMENT ${o[2].cash<0?'£'+(-o[2].cash)+'k':'NO DIRECT SPEND'} · ADDITIONAL CONSEQUENCES POSSIBLE</em></span>${S.choice===i?'<span class="tick">✓</span>':''}</button>`).join('')}</div>`;}

function resolve(){if(!ready())return;const t=S.teams[S.turn];if(t.log.length!==S.r)return;const r=questions[S.r],pre={...t.m},br=briefing(S.picks,S.r),events=[];let delta={},choice='',id='';

Object.assign(delta,base);

if(S.r===0)t.flags.early=id;
if(S.r===2){t.flags.investigation=id;if(id==='internal'&&(t.allocation.forensics||0)>=2){accrue({evidence:8,risk:-6});events.push('Earlier technical investment made the lower-cost internal audit substantially more useful.');}if(id==='internal'&&!(t.allocation.forensics||0)){accrue({evidence:-7,risk:8});events.push('Internal auditors were sent to investigate without the technical capacity they needed.');}if(t.flags.early==='early'&&t.m.evidence<48){accrue({staff:-5,client:-5});events.push('The fast holding statement needed a correction; some employees felt misled.');}}

if(S.r===5){t.flags.final=id;if(t.flags.deal==='credits'){t.flags.creditThresholdService=t.m.service;if(t.m.service<72){accrue({cash:-26,client:-6,risk:6});t.flags.creditTriggered=true;events.push('The agreed service-credit threshold was missed BEFORE the board recovery plan; £26k is now a contractual liability reserved in this budget.');}else{accrue({client:5});events.push('Delivery met the service-credit threshold before the board vote, so no penalty was reserved.');}}
if(t.flags.early==='clients'&&t.flags.noPeople){accrue({staff:-8,service:-4});events.push('Staff communication was neglected from the start. Attrition pressure now affects delivery.');}
if(t.m.staff<47){accrue({service:-8,risk:5});events.push('Worn-out employees can no longer absorb more “urgent” initiatives without delivery slipping.');}
if(t.flags.investigation==='preserve'&&t.m.evidence<55){accrue({risk:10,client:-5});events.push('The unresolved investigation is now a direct board concern.');}
}}
// Advice creates a benefit only when teams ACT on the intelligence. No magic score for opening a portrait.
const informed=S.picks,has=i=>informed.includes(i);

if(S.r===4&&S.messages.includes(1)&&has(0)){accrue({staff:3});events.push('People & Culture defined ownership for the funded support line.');}

const changes=Object.fromEntries(Object.entries(delta).map(([k,v])=>[k,Math.round(v)]));change(t,changes);
if(S.r===5){if(t.m.client>=71&&t.m.service>=64&&t.exposure.contract<=56&&!t.flags.creditTriggered){t.commercial='renewed';events.push('The client signs the £240k annual renewal following the recovery commitments. This protects future contracted revenue; nothing is added to the response fund.');}

const real=Object.fromEntries(Object.keys(t.m).map(k=>[k,t.m[k]-pre[k]]));const movement=Math.round(Math.abs(real.staff)*.16+Math.abs(real.client)*.20+Math.abs(real.evidence)*.15+Math.abs(real.service)*.2+Math.abs(real.cash)*.35);

function cashArc(t){
 const rounds=Array.from({length:6},(_,i)=>t.ledger.filter(x=>x.round===i).reduce((s,x)=>s+x.amount,0));
 const cap=Math.max(1,...rounds.map(x=>Math.abs(x)));
 return `<div class="arc" aria-label="Per-round cash expenditure">${rounds.map((v,i)=>`<div class="arcPart"><div class="arcCol"><i style="height:${Math.max(4,Math.abs(v)/cap*100)}%;background:${v<0?'#6ce3c3':'#f7b65f'}"></i></div><small>${i+1}</small><b>${v<0?'+':'−'}£${Math.abs(v)}k</b></div>`).join('')}</div>`;
}

function finaleFlag(t){

 if(e.remaining<0)return {title:'FUNDING GAP',tone:'danger',detail:`£${Math.abs(e.remaining)}k beyond the authorised 90-day fund`};

}

function finaleReceipt(t){
 const e=economics(t),flag=finaleFlag(t);const p=finalePivots(t);
 const line=t.log.map((l,i)=>{const rr=receipt(t,l,i);return `<div class="fa-receipt-row"><div><span class="fa-receipt-index">${String(i+1).padStart(2,'0')}</span><strong>${X(questions[i].title)}</strong><small>${X(l.choice)}</small></div><b>${rr.cashSpent<0?'+':'−'}£${Math.abs(rr.cashSpent)}k</b></div>`}).join('');
 return `<div class="fa-receipt-stage"><div class="fa-receipt-card" role="region" aria-label="Itemised recovery budget receipt for ${X(t.name)}">
 <div class="fa-receipt-top">NORTHLINE ADVISORY <span>CASE 09:17</span></div>
 <div class="fa-receipt-heading">THE CRISIS<br>RECEIPT</div><div class="fa-receipt-sub">ACCOUNT: ${X(t.name)}<br>HORIZON: 90-DAY RESPONSE FUND<br>6 EPISODES / AUTHORISED £${START}k</div>
 <div class="fa-receipt-rule"></div>${line}<div class="fa-receipt-rule"></div>
 <div class="fa-receipt-total"><span>GROSS FUND COMMITMENTS</span><strong>£${e.spent}k</strong></div>${e.recovered>0?`<div class="fa-receipt-total small"><span>RECOVERIES CREDITED</span><strong>−£${e.recovered}k</strong></div>`:''}<div class="fa-receipt-total"><span>NET FUND USED</span><strong>£${e.spent-e.recovered}k</strong></div>
 <div class="fa-receipt-total small"><span>BASELINE OBLIGATIONS (INCLUDED ABOVE)</span><strong>£${e.overhead}k</strong></div>
 <div class="fa-receipt-total small"><span>STRATEGIC CHOICES / LIABILITIES (INCLUDED ABOVE)</span><strong>£${e.choices}k</strong></div>
 <div class="fa-receipt-cash"><span>${e.remaining<0?'FUNDING GAP':'UNCOMMITTED CASH'}</span><b>${signedCash(e.remaining)}</b></div>
 <div class="fa-receipt-foot"><div>ANNUAL RENEWAL: £${CLIENT_CONTRACT}k<br>${X(flag.title)} / NOT PART OF FUND CASH</div><div class="fa-receipt-seal">${t.score}<small>/ 100</small></div></div>
 <div class="fa-receipt-thanks">EVERY DECISION LEFT A RECEIPT.</div>
 </div><div class="fa-receipt-side"><span class="fa-section-label">BOARDROOM EXHIBIT 01</span><h3>No imaginary profits.<br>No invisible costs.</h3><p>This receipt uses the recorded six-round ledger. The £${CLIENT_CONTRACT}k annual client contract is future commercial value, not money added to the £${START}k recovery fund.</p><div class="fa-fact"><span>UNAVOIDABLE RESPONSE COMMITMENTS</span><b>£${e.overhead}k</b></div><div class="fa-fact"><span>DECISIONS, SERVICES AND LIABILITIES</span><b>£${e.choices}k</b></div><div class="fa-fact"><span>CONTRACT OUTCOME</span><b>${X(flag.title)}</b></div><p class="fa-smallprint">Costs are simulated 90-day commitments, not claims that every invoice was paid during the five-day story.</p><button class="fa-outline" type="button" data-act="final-print">PRINT THIS VERDICT</button></div></div>`;
}
function finaleEvidence(t,all){
 const b=scoreBreak(t),r=businessOutcome(t),analysis=narrative(t),exposures=Object.entries(t.exposure).sort((a,b)=>b[1]-a[1]);
 return `<div class="fa-evidence"><div class="fa-evidence-lead"><div><span class="fa-section-label">CASE FILE / RECONSTRUCTED FROM ACTUAL DECISIONS</span><h3>${X(r[0])}</h3><p>${X(r[1])}</p></div><div class="fa-evidence-score">${t.score}<small>/100</small></div></div>
 <div class="fa-evidence-narrative">${analysis.map(v=>`<p>${X(v)}</p>`).join('')}<p><b>HEAD TO HEAD:</b> ${X(juxtapose(t,all.find(x=>x.id!==t.id)))}</p></div>
 <details class="fa-technical"><summary>Full decision and consequence timeline</summary><ol class="tape">${t.log.map((l,i)=>receiptHTML(t,l,i)).join('')}</ol></details>
 <details class="fa-technical"><summary>How the score was calculated</summary><div class="fa-score-break"><div>Operating performance <b>${b.operating}</b></div><div>Adviser intelligence <b>+${b.intelligence}</b></div><div>Mandate bonus <b>+${b.mandateBonus}</b></div><div>Financial penalty <b>−${b.penalty}</b></div><div>Contract penalty <b>−${b.contractPenalty}</b></div><div>Service penalty <b>−${b.fragile}</b></div></div><div class="fa-exposure-list">${exposures.map(([k,v])=>`<span>${X(k)}: <b>${v}/100</b></span>`).join('')}</div></details>
 </div>`;
}
function final(){
 const all=[...S.teams].sort((a,b)=>b.score-a.score),best=all[0];
 if(!S.finalReveal){page(`<main class="screen fa-final">
 <section class="cinema-entry fa-curtain" aria-label="Final verdict introduction"><div class="fa-curtain-wash"></div><div class="fa-curtain-content"><div class="fa-red-time"><span></span> THE 09:17 INCIDENT / FIVE DAYS LATER</div><div class="fa-curtain-icon" aria-hidden="true">⚖</div><h1>THE BOARD<br><em>HAS DECIDED.</em></h1><p>Six episodes. The same crisis. Different decisions. There is no hiding behind the spreadsheet now.</p><button type="button" class="fa-enter" data-act="final-unseal">REVEAL THE VERDICT <span>→</span></button></div><div class="fa-curtain-foot">NORTHLINE ADVISORY · CLOSED-DOOR BOARD REVIEW <span>CASE FILE 09:17</span></div></section></main>`);return;}
 const selected=all.find(t=>t.id===S.finalTeam)||best,tab=S.finalTab||'story';const winnerTie=all.filter(t=>t.score===best.score).length>1;
 const flag=finaleFlag(best),e=economics(best);
 page(`<main class="screen fa-final"><section class="cinema-entry fa-final-hero"><div class="fa-curtain-wash"></div><div class="fa-final-hero-content"><div class="fa-red-time"><span></span> CASE 09:17 / THE FINAL REVEAL</div><h1>THE BOARDROOM<br><em>RECKONING.</em></h1><p>The numbers are in. The promises have come due. Who survived the week — and at what cost?</p><div class="fa-golden-line"></div><div class="fa-win-label">${winnerTie?'THE JOINT BOARDROOM CHAMPIONS':'THE BOARDROOM CHAMPION'}</div><div class="fa-win-name">${X(all.filter(t=>t.score===best.score).map(t=>t.name).join(' & '))}</div><div class="fa-win-metric"><b>${best.score}</b><span>OUT OF 100</span></div><div class="fa-win-note">${X(businessOutcome(best)[1])}</div></div><div class="fa-curtain-foot">${X(award(best))}<span>REVIEW COMPLETE</span></div></section>
 <div class="fa-section-head"><span>01 / THE PODIUM</span><h2>Same crisis. Very different exits.</h2><p>Scores are a fictional company-performance measure, not an assessment of the people playing.</p></div>
 ${finalePodium(all)}
 <div class="fa-newsflash"><div class="fa-newsflash-label">09:17 NEWSWIRE / BOARDROOM AFTERMATH</div><div class="fa-newsflash-body">${X(highlightLine(best))}</div></div>
 <section class="fa-casework"><div class="fa-section-head"><span>02 / THE EVIDENCE</span><h2>Open their case files.</h2><p>These aren't generic endings. Each receipt, decision and exposure comes from that team's actual choices.</p></div>
 <div class="fa-team-select" role="group" aria-label="Choose a team to inspect">${all.map(t=>`<button type="button" data-final-team="${t.id}" class="${selected.id===t.id?'active':''}" aria-pressed="${selected.id===t.id}"><strong>${X(t.name)}</strong><span>${t.score} points</span></button>`).join('')}</div>
 <div class="fa-case-heading"><div><span>DECLASSIFIED // FILE ${String(selected.id+1).padStart(2,'0')}</span><h3>${X(selected.name)}</h3><p>${X(award(selected))}</p></div><div class="fa-score-mark">${selected.score}<small>/100</small></div></div>
 <div class="fa-tabs" role="group" aria-label="Case file views"><button type="button" data-final-tab="story" class="${tab==='story'?'active':''}" aria-pressed="${tab==='story'}">THE STORY</button><button type="button" data-final-tab="receipt" class="${tab==='receipt'?'active':''}" aria-pressed="${tab==='receipt'}">THE RECEIPT</button><button type="button" data-final-tab="evidence" class="${tab==='evidence'?'active':''}" aria-pressed="${tab==='evidence'}">FULL EVIDENCE</button></div>
 <div class="fa-tab-content" aria-live="polite">${tab==='receipt'?finaleReceipt(selected):tab==='evidence'?finaleEvidence(selected,all):finaleStory(selected,all)}</div></section>
 <section class="fa-close"><span>03 / THE DEBRIEF</span><h2>Would you make<br><em>the same call again?</em></h2><p>What did your team protect? What did it sacrifice? And which promise came back to haunt you?</p><div class="fa-close-actions"><button type="button" class="fa-enter" data-act="replay">RUN THE CRISIS AGAIN <span>↻</span></button><button type="button" class="fa-outline" data-act="report">${S.report?'HIDE FULL REPORT':'OPEN THE FACILITATOR REPORT'}</button></div>${S.report?`<div class="fa-download"><textarea readonly aria-label="Copyable full financial and decision report">${X(reportText())}</textarea><button class="fa-outline" type="button" data-act="download">DOWNLOAD REPORT (.TXT)</button></div>`:''}</section></main>`);
}

function reportText(){return 'BUSINESS CRISIS / THE 09:17 INCIDENT · V1.0 RC\n\n'+[...S.teams].sort((a,b)=>b.score-a.score).map(t=>{const e=economics(t);return `${t.name} — ${t.score} pts\n${businessOutcome(t).join(': ')}\nBudget committed: £${e.spent}k; budget left: £${e.remaining}k; composite risk: ${t.m.risk}\nContract: ${t.commercial}\n\n${narrative(t).join('\n\n')}\n\nDECISION HISTORY\n${t.log.map((l,i)=>`${i+1}. ${l.round}: ${l.choice}\n${receipt(t,l,i).read}\nBUDGET MOVEMENT: £${receipt(t,l,i).cashSpent}k allocated or reserved (including £${receipt(t,l,i).overhead}k baseline)\nMETRICS: ${receipt(t,l,i).movement.map(v=>`${v.name} ${signAmount(v.value)}`).join('; ')}\n${l.events.join(' ')}`).join('\n\n')}`}).join('\n\n------\n\n');}
function render(){if(S.phase==='home')intro();else if(S.phase==='setup')setup();else if(S.phase==='brief')briefingPage();else if(S.phase==='turn')turn();else if(S.phase==='recap')recap();else if(S.phase==='final')final();}
function start(){S.phase='home';fillTeams();render()}
document.addEventListener('input',e=>{if(e.target.matches('[data-pid]')){let p=S.players.find(p=>p.id===Number(e.target.dataset.pid));if(p){p.name=e.target.value;const tp=S.teams.find(t=>t.members.some(x=>x.id===p.id));if(tp){let match=tp.members.find(x=>x.id===p.id);match.name=p.name;}}}else if(e.target.matches('[data-custom]')){S.teams[Number(e.target.dataset.custom)].name=e.target.value;const go=document.querySelector('[data-act="brief"]');if(go)go.disabled=S.teams.some(t=>!t.members.length)||!teamNamesValid();}});
document.addEventListener('change',e=>{if(e.target.id==='teamcount'){S.count=Number(e.target.value);fillTeams();render()}else if(e.target.matches('[data-tname]')){const t=S.teams[Number(e.target.dataset.tname)];t.name=e.target.value==='custom'?'MY TEAM':e.target.value;render()}else if(e.target.matches('[data-mandate]')){S.teams[Number(e.target.dataset.mandate)].mandate=e.target.value;render()}else if(e.target.matches('[data-move]')){const id=Number(e.target.dataset.move),dest=Number(e.target.value);let p=S.players.find(x=>x.id===id);for(const t of S.teams)t.members=t.members.filter(x=>x.id!==id);S.teams[dest].members.push(p);render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.closest('#app'))return;const a=b.dataset.act;
if(a==='setup')S.phase='setup';else if(a==='addPlayer'){S.players.push(player(''));fillTeams()}else if(b.hasAttribute('data-remove')){S.players=S.players.filter(p=>p.id!==Number(b.dataset.remove));fillTeams()}else if(a==='shuffle')fillTeams(true);else if(a==='brief'){if(S.teams.some(t=>!t.members.length)||!teamNamesValid())return;S.phase='brief'}else if(a==='start'){S.phase='turn';S.r=0;S.turn=0;resetTurn()}else if(b.hasAttribute('data-role')){const i=Number(b.dataset.role);if(S.picks.includes(i))S.picks=S.picks.filter(v=>v!==i);else if(S.picks.length<2)S.picks.push(i)}else if(a==='confirm'){if(S.picks.length===2)S.confirmed=true;}else if(b.hasAttribute('data-choice'))S.choice=Number(b.dataset.choice);else if(b.hasAttribute('data-doc')){const i=Number(b.dataset.doc);if(!S.docs.includes(i))S.docs.push(i)}else if(b.hasAttribute('data-message')){const i=Number(b.dataset.message);if(S.messages.includes(i))S.messages=S.messages.filter(v=>v!==i);else if(S.messages.length<2)S.messages.push(i)}else if(b.hasAttribute('data-budget')){const id=b.dataset.budget,v=Number(b.dataset.inc);if(v>0&&(sum(S.alloc)>=5||S.alloc[id]>=2))return;S.alloc[id]=clamp(S.alloc[id]+v,0,2)}else if(a==='lock'){resolve();return}else if(a==='next'){if(S.r===5){S.phase='final';S.finalReveal=false;S.finalTeam=null;S.finalTab='story';}else{S.r++;S.turn=0;resetTurn();S.phase='turn'}}else if(a==='final-unseal'){S.finalReveal=true;S.finalTeam=[...S.teams].sort((x,y)=>y.score-x.score)[0]?.id;S.finalTab='story';}else if(b.hasAttribute('data-final-team')){S.finalTeam=Number(b.dataset.finalTeam);S.finalTab='story';}else if(b.hasAttribute('data-final-tab')){S.finalTab=b.dataset.finalTab;}else if(a==='final-print'){window.print();return;}else if(a==='replay'){S.finalReveal=false;S.finalTeam=null;S.finalTab='story';S.teams=S.teams.map(old=>{const t=newTeam(old.id);t.name=old.name;t.mandate=old.mandate;t.members=[...old.members];return t;});S.r=0;S.turn=0;resetTurn();S.variant=TWISTS[(TWISTS.indexOf(S.variant)+1+Math.floor(Math.random()*(TWISTS.length-1)))%TWISTS.length];S.phase='brief';S.report=false}else if(a==='report')S.report=!S.report;else if(a==='download'){const blob=new Blob([reportText()],{type:'text/plain'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='business-crisis-verdict.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),500);return;}render();});
start();
</script></body></html>
