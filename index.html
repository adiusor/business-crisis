/* BUSINESS CRISIS — DIRECTOR'S CUT / V1.2: purpose-built game stage layouts */

:root{--bg:#06111c;--sheet:#102235;--sheet2:#1b3044;--edge:#426077;--white:#fff5e9;--text:#e0e7ea;--muted:#a7b6c2;--hot:#f6b454;--mint:#71dec4;--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Manrope',Arial,sans-serif}
html{scroll-behavior:smooth}body{background:#050c16;font-size:16px;line-height:1.56}
#app{background:radial-gradient(circle at 92% 4%,#1c3142 0,transparent 41%),#08101b;overflow-x:clip}
.wrap{max-width:1390px}.nav{min-height:76px;border-bottom:1px solid #92a3ae30}.brand{font-size:30px;line-height:.72;letter-spacing:-.02em}.navchip{font-size:12px}.live{font-size:11px}.live i{animation:flash 1.4s 3}
.primary{border-radius:7px;font:900 21px var(--display);letter-spacing:.035em;box-shadow:0 4px 0 #a4672e,0 11px 23px #0006}.primary:not(:disabled):hover{box-shadow:0 6px 0 #a4672e,0 16px 30px #0008}
.secLabel,.eyebrow{letter-spacing:.08em;font-size:12px}.tiny{font-size:13px}.panel{box-shadow:none;border-color:#385166;background:#101d2e;border-radius:10px}
.panel h2,.panel h3{line-height:1.04}.field,.fieldLabel{font-size:15px}.field{min-height:46px;background:#0c1725;border-color:#567089}.field:focus{background:#14263a}
.reveal{animation:bcScene .3s ease-out both}@keyframes bcScene{from{opacity:.92;transform:translateY(5px)}to{opacity:1;transform:none}}
/* Opening: hero art fills the canvas; no metrics or dashboard chrome. */
.cinema-entry{min-height:680px;border-radius:8px;box-shadow:0 40px 100px #0009;border:1px solid #987f605e}
.cinema-glaze{background:linear-gradient(90deg,#04111ff5 0%,#071a2cda 26%,#081629a3 44%,transparent 80%),linear-gradient(0deg,#08101b 0%,transparent 48%)}
.cinema-series{font-size:12px;letter-spacing:.14em}.cinema-logo{font-size:clamp(78px,10.5vw,178px);line-height:.72;text-shadow:0 7px 28px #0009}
.cinema-tagline{font-size:clamp(29px,4.1vw,64px);max-width:600px;line-height:.94;margin:25px 0 12px;text-transform:none}
.cinema-desc{font-size:clamp(17px,1.55vw,20px);line-height:1.58;max-width:555px;text-wrap:pretty;color:#e8e8e9}
.cinema-meta{gap:6px}.cinema-meta span{font-size:12px}.cinema-cta{margin-top:10px;font-size:23px;min-height:58px;padding:14px 30px}.cinema-fine{font-size:12px}
.premise-strip{background:#081522;border-color:#344b62}.premise-strip div{border-color:#344b62}.premise-strip b{font-size:13px}.premise-strip span{font-size:14px}
/* Lobby — team selection feels like entering a match, not completing a form. */
.lobby-screen{position:relative;isolation:isolate;padding-top:43px}.lobby-screen:before{content:'';position:absolute;z-index:-1;inset:0 0 auto;height:410px;background:linear-gradient(180deg,#0a1425bd,#08101bf5),var(--bc-boardroom);background-size:cover;background-position:center 51%;opacity:.62}
.lobby-screen>.heading{min-height:195px;align-items:start}.lobby-screen .heading h1{font-size:clamp(57px,6vw,104px);line-height:.84;margin-top:18px}.lobby-screen .heading p{font-size:18px;max-width:560px}
.lobby-screen .layout{grid-template-columns:minmax(0,.93fr) minmax(0,1.07fr)}
.lobby-screen .layout>.panel{background:#102135ed;border-color:#61738a67;backdrop-filter:blur(10px)}
.lobby-screen .layout>.panel:nth-child(2){background:linear-gradient(143deg,#152b45e8,#121d2fe8);position:relative;overflow:hidden}
.lobby-screen .layout>.panel:nth-child(2) h2{font-size:clamp(32px,3vw,47px);max-width:380px}
.lobby-file{width:min(335px,90%);min-height:172px;background:#ebe0c8;color:#26303a;box-shadow:9px 12px 0 #050d1b80;padding:19px 21px;margin:20px 0 28px;transform:rotate(-2deg);display:grid;gap:9px;border-left:6px solid #b95a48}
.lobby-file span{color:#a84d3f;font:800 13px var(--body);letter-spacing:.13em}.lobby-file b{font:900 31px/.9 var(--display)}.lobby-file i{font:800 11px var(--body);letter-spacing:.08em}.lobby-file strong{font:900 17px var(--display)}
.lobby-screen .teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lobby-screen .team{background:linear-gradient(160deg,#142b45,#0c192b);border:1px solid #6582a2;border-radius:8px;padding:20px;position:relative;box-shadow:inset 0 3px 0 #f2ad68}.lobby-screen .team:nth-child(2){box-shadow:inset 0 3px 0 #77baf0}.lobby-screen .team:nth-child(3){box-shadow:inset 0 3px 0 #70d3ae}.lobby-screen .team:nth-child(4){box-shadow:inset 0 3px 0 #c79bee}.lobby-screen .team>b{font:900 25px var(--display);letter-spacing:.03em}
/* Leaked document dossier in the briefing. */
.mission-screen .mission-head{min-height:250px;padding:42px 15px 10px 25px;background:linear-gradient(90deg,#0a1421e8,#0a1421),var(--bc-boardroom);background-position:center;background-size:cover;border-left:3px solid var(--hot)}
.mission-head h1{font-size:clamp(54px,6vw,95px);line-height:.88}.mission-head p{font-size:19px;line-height:1.65;max-width:820px}
.mission-story{position:relative;background:#eee8db;color:#192538;padding:34px 36px 32px;border:1px solid #d1bda0;box-shadow:7px 9px 0 #0b111e;overflow:hidden}
.mission-story .secLabel{color:#915b2c}.mission-story h2{font-size:clamp(34px,4.2vw,57px);color:#15283b;line-height:.9}
.mission-story .mission-large{font-size:clamp(18px,2vw,23px);line-height:1.5;color:#23364a;max-width:660px}
.document-header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:16px;margin-bottom:24px;border-bottom:2px solid #c8b89f;font:800 12px var(--body);letter-spacing:.05em;color:#5e6064}.mail-red{color:#ac4840;border:2px solid #ac4840;padding:3px 6px;transform:rotate(-3deg)}
.mission-story .divider{background:#b9a98f}.mission-story .mission-steps{font-size:16px;color:#283b4b}.mission-story .mission-steps b{color:#13263c}.mission-caveat{color:#59636d;border-color:#c7baaa}
.mission-finance .budget-card,.mission-finance .contract-card{border-radius:7px;box-shadow:none}.mission-finance .budget-card strong,.mission-finance .contract-card strong{font-size:clamp(50px,5.5vw,80px)}
/* Every episode is its own cinematic scene; story stays readable, art lives to its right. */
.play-screen{padding-top:18px}.turnbanner{background:#15253a;border:1px solid #46627a;border-bottom:0;border-radius:7px 7px 0 0;padding:11px 16px;font-size:12px}
.play-screen .roundsteps{margin:0 0 12px;background:#0e1a2b;border:1px solid #426077;border-top:0;padding:10px;display:flex;gap:5px;justify-content:center}
.play-screen .scene{min-height:clamp(300px,34vw,420px);border:1px solid #66758a;border-radius:8px;box-shadow:0 24px 44px #0005;padding:clamp(24px,4vw,58px);background-size:cover;background-position:center;background-repeat:no-repeat;isolation:isolate}
.play-screen .scene:before{display:none}.play-screen .scene:after{height:4px;width:30%;background:linear-gradient(90deg,#f9ac5b,transparent)}
.scene-visual{display:none}.play-screen .scene .signal{position:relative;color:#f6c389;font-size:12px;letter-spacing:.1em}.play-screen .scene h2{position:relative;font:900 clamp(46px,5.8vw,85px)/.86 var(--display);letter-spacing:.002em;max-width:680px;text-shadow:0 5px 13px #04111c}.play-screen .scene p{font-size:clamp(17px,1.9vw,23px);color:#ecf1ed;max-width:660px;line-height:1.55;text-shadow:0 3px 10px #03101a}
.play-screen>.layout{grid-template-columns:minmax(0,1.5fr) minmax(260px,.62fr);gap:15px}.play-screen>.layout>.panel,.play-screen .layout>section>.panel{border:1px solid #647a8c;background:linear-gradient(150deg,#172c40,#101d2e);padding:clamp(18px,2.5vw,31px);border-radius:8px}
.play-screen .layout>section>.panel>h2{font-size:clamp(33px,3.5vw,52px);color:#ffdeab;text-wrap:balance}
.pulse-panel{background:#112338;border-top:4px solid #eaa55b!important;padding:19px!important}.pulse-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.pulse-stats>div{background:#1e354e;border:1px solid #537088;padding:14px 10px;border-radius:6px}.pulse-stats span{font-size:11px;display:block;color:#d1dbe2}.pulse-stats b{font:900 clamp(24px,3vw,37px) var(--display);color:#ffd089}.pulse-stats small{font:700 12px var(--body)}
.pulse-fact{display:grid;gap:2px;border-bottom:1px solid #41536a;padding:11px 0}.pulse-fact span{color:#9fb7c8;font-size:12px}.pulse-fact b{font-size:14px;color:#edeae7}.pulse-panel .quote{padding:13px;background:#24384a}
.health-drawer{border:1px solid #54728b;padding:10px;border-radius:4px;font-size:12px;margin:6px 0}.health-drawer summary{cursor:pointer;color:#f7c88d;font-weight:800}.health-drawer[open]{margin-bottom:15px}.health-drawer .metrics{margin-top:12px}
.incident-log{border:1px solid #354f63;background:#0b1b2b;margin-top:14px;padding:18px;border-radius:5px}.incident-log ol{list-style:none;margin:13px 0 0;padding:0;display:grid;gap:13px}.incident-log li{display:grid;grid-template-columns:55px 1fr;gap:10px;font-size:12px;color:#bccad5}.incident-log time{color:#ffb56c;font-weight:800}
/* High-resolution scalable character artwork; all six portraits are inline SVG. */
.play-screen.advisers .roles{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:18px 0}.play-screen .role{border-radius:7px;min-height:0;background:#0c1b2e;border:1px solid #567085;overflow:hidden;box-shadow:none}.play-screen .rolephoto{height:clamp(172px,21vw,260px);background-size:cover;background-position:center 18%;filter:none;border-bottom:2px solid #ab804f}.play-screen .rolefoot{background:#132338;min-height:74px;padding:11px 9px}.play-screen .rolename{font:900 clamp(17px,2.1vw,26px)/.9 var(--display);color:#fff3e6;letter-spacing:.025em}.play-screen .rolerole{font-size:11px;color:#cbd4da;letter-spacing:0;margin-top:8px}.play-screen .role.picked{box-shadow:0 0 0 3px #f0b261,0 16px 24px #0005;transform:translateY(-2px)}.play-screen .role.locked{opacity:.64;filter:grayscale(.25)}
.play-screen .intel{background:#e8e6dd;color:#203046;border:1px solid #c3a987;border-left:5px solid #d8994d;line-height:1.65;font-size:16px}.play-screen .intel b{font-size:17px;color:#1a3346}.play-screen .intel .label{color:#926237}
/* Decision cards have physical, tactile game feel. */
.play-screen .decision-grid,.play-screen .casefile-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.play-screen .choice{transition:transform .14s,box-shadow .14s,border-color .14s}.play-screen .decision-grid .choice{min-height:165px;background:#e9e2d6;border:1px solid #ccb99d;box-shadow:0 5px 0 #8e785d;color:#16273c;border-radius:5px;padding:17px 18px;position:relative;overflow:hidden}.play-screen .decision-grid .choice:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:#dcaa6a}.play-screen .decision-grid .choice:nth-child(2):before{background:#73bbce}.play-screen .decision-grid .choice:nth-child(3):before{background:#ce7e6f}.play-screen .decision-grid .choice:nth-child(4):before{background:#9e8fc2}.play-screen .decision-grid .choice:nth-child(5):before{background:#81ab82}.play-screen .decision-grid .choice:nth-child(6):before{background:#d5bb68}
.play-screen .decision-grid .choice strong{font:900 clamp(22px,2.2vw,29px)/1.04 var(--display);letter-spacing:0}.play-screen .decision-grid .choice small{font:500 14px/1.45 var(--body);color:#445269}.play-screen .decision-grid .choice em{font-size:11px;color:#71502d;line-height:1.4}
.play-screen .decision-grid .choice.picked{background:#fff0cb;outline:3px solid #e5ab54;box-shadow:0 5px 0 #b1884a}.play-screen .decision-grid .choice:not(:disabled):hover{transform:translateY(-3px)}
.allocation-grid .details{border-radius:5px;background:#132c43}.casefile-grid .choice{border-radius:5px}
/* Dramatic consequence screen: editorial newsroom lead, not dashboard. */
.fallout-screen{padding-top:24px}.fallout-stage{border:1px solid #875e57;position:relative;overflow:hidden;background:linear-gradient(90deg,#081929f7 0,#132539d9 60%,#132539ad),var(--bc-boardroom);background-size:cover;background-position:center;min-height:300px;padding:23px clamp(20px,4vw,55px);border-radius:8px}
.fallout-onair{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:850;letter-spacing:.09em;color:#ffd0a3;border-bottom:1px solid #ffffff38;padding-bottom:14px}.fallout-onair i{width:10px;height:10px;border-radius:50%;background:#ec634f;box-shadow:0 0 0 4px #ef664433}.fallout-onair span{margin-left:auto;color:#b5c9d6}.fallout-stage-inner{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:32px}.fallout-stage h1{font:900 clamp(62px,9vw,145px)/.84 var(--display);color:#fff1e4;margin:17px 0}.fallout-stage p{font-size:19px;color:#e5edf3;max-width:650px}.fallout-stamp{font:900 clamp(44px,7vw,110px)/.8 var(--display);border:7px solid #d65a51;color:#f19c78;transform:rotate(-12deg);padding:15px 20px;opacity:.75}
.fallout-roll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:22px 0}.fallout-team{background:#142639;border:1px solid #4a6076;padding:24px 25px 21px;box-shadow:0 8px 0 #09111b}.fallout-team:nth-child(even){border-top:4px solid #76b7dc}.fallout-team:nth-child(odd){border-top:4px solid #ffb05e}.fallout-team header{display:flex;align-items:center;justify-content:space-between;gap:13px}.fallout-team-tag{font:900 21px var(--display);color:#e6d2bb}.fallout-funds{font:900 29px var(--display);color:#f7c48d;text-align:right}.fallout-funds small{display:block;font:700 10px var(--body);color:#bacbd9;letter-spacing:.06em}.fallout-team h3{font:900 clamp(30px,3vw,45px)/1 var(--display);color:white;margin:20px 0 10px}.fallout-narrative{font-size:17px;line-height:1.6;min-height:85px}.fallout-aftershock{padding:10px;color:#ffd6b6;background:#622f294e;border-left:3px solid #f09b6e}.fallout-effects{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:14px 0;border-top:1px solid #ffffff27;border-bottom:1px solid #ffffff27;margin:15px 0}.fallout-effects span{display:grid;gap:4px;text-align:center}.fallout-effects small{font-size:10px;color:#b1c5d4}.fallout-effects strong{font:900 23px var(--display)}.fallout-effects .gain strong{color:#75d9b4}.fallout-effects .loss strong{color:#ff987b}.fallout-ledger{border:1px solid #526a83;padding:12px;background:#122136}.fallout-ledger summary{cursor:pointer;font-weight:800;color:#eec493}.fallout-ledger div{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #ffffff18;padding:7px 0}.fallout-ledger p{font-size:13px;color:#b8c9d8}
.fallout-next{background:#f0e5d5;color:#17263b;display:flex;gap:20px;align-items:center;justify-content:space-between;padding:26px 31px;margin:22px 0;border-left:6px solid #e0a25c}.fallout-next h2{font:900 clamp(29px,3.2vw,40px)/1.1 var(--display);max-width:750px;margin:10px 0}.fallout-next p{font-size:14px}.fallout-next .primary{white-space:nowrap}
/* Final act: winner's scene -> podium -> evidence; paper receipts become the only paper. */
.fa-final-hero,.fa-curtain{border-radius:7px;box-shadow:0 25px 70px #0009}.fa-final-hero h1{font-size:clamp(78px,10.5vw,160px);line-height:.8}.fa-final-hero .fa-win-name{font-size:clamp(44px,5.5vw,85px)}.fa-podium-team{border-radius:6px;background:linear-gradient(145deg,#152b44,#0b1928);box-shadow:0 8px 0 #080e18}.fa-podium-team.is-winner{background:linear-gradient(145deg,#4e3524,#1e2b3b 60%);border-color:#e0b170}.fa-casework{background:linear-gradient(180deg,#0c1d2f,#091521);border-top:1px solid #64778a;padding-top:26px}.fa-case-heading{border-radius:4px}.fa-case-heading h3{font-size:clamp(40px,5vw,70px)}.fa-tab-content{border-radius:0 0 5px 5px;background:#112033}.fa-receipt-card{box-shadow:12px 14px 0 #080f1d,0 20px 40px #000a}
/* Common accessibility and real-device layout. */

@media(max-width:740px){.cinema-bottom{white-space:normal;align-items:flex-start;gap:7px;flex-wrap:wrap;padding:10px 14px}.cinema-news{white-space:normal;text-overflow:clip;line-height:1.45;flex:1 1 180px;font-size:10px;letter-spacing:.045em}.cinema-bottom .red-led{font-size:10px}.cinema-clock{display:none}}
@media(max-width:380px){.wrap{padding-left:12px;padding-right:12px}.cinema-logo{font-size:67px}.cinema-tagline{font-size:32px}.cinema-content{padding-left:16px;padding-right:16px}.play-screen .rolename{font-size:17px}.play-screen .rolephoto{height:167px}.play-screen .scene h2{font-size:47px}.play-screen .pulse-stats b{font-size:27px}.fallout-effects strong{font-size:19px}}

function recomputeRisk(t){const m=t.m,p=t.pressure||{},f=t.flags;
 const legal=clamp(83-m.evidence*.56+(f.investigation==='preserve'?11:0)+(f.investigation==='external'?-6:0)+(p.legal||0),9,98);
 const ops=clamp(79-m.service*.72+(f.noOps?10:0)+(m.staff<46?11:0)+(p.operational||0),9,98);

 t.exposure={legal:Math.round(legal),operational:Math.round(ops),staff:Math.round(staff),contract:Math.round(contract),financial:Math.round(liquidity)};
 m.risk=Math.round(clamp(legal*.29+ops*.23+staff*.15+contract*.19+liquidity*.14,12,96));
}

const RISK_CHANNELS=[{legal:.40,staff:.35,operational:.25},{legal:.25,operational:.35,staff:.20,contract:.20},{legal:.80,operational:.20},{contract:.72,operational:.28},{staff:.75,contract:.25},{legal:.52,operational:.29,contract:.19}];

function mandate(t){return mandates.find(x=>x.id===t.mandate)||mandates[0]}
function mandateMet(t){const m=t.m;return t.mandate==='staff'?m.staff>=74&&m.risk<=40:t.mandate==='client'?m.client>=75&&m.service>=65:t.mandate==='evidence'?m.evidence>=75&&m.risk<=33:m.cash>=45&&m.service>=65;}
function economics(t){const spent=t.ledger.filter(x=>x.amount>0).reduce((a,b)=>a+b.amount,0);const recovered=-t.ledger.filter(x=>x.amount<0).reduce((a,b)=>a+b.amount,0);return {spent,recovered,remaining:t.m.cash,overhead:t.ledger.filter(x=>x.reason==='Mandatory incident response').reduce((a,b)=>a+b.amount,0),choices:spent-t.ledger.filter(x=>x.reason==='Mandatory incident response').reduce((a,b)=>a+b.amount,0)};}
function scoreBreak(t){const m=t.m,e=economics(t);
 const liquid=clamp(25+((m.cash-15)/80)*75,0,100);
 const operating=Math.round(.15*m.staff+.17*m.client+.15*m.evidence+.21*m.service+.17*(100-m.risk)+.15*liquid);
 const intelligence=Math.min(4,Math.round(t.intel*.30));
 const mandateBonus=mandateMet(t)&&m.cash>=0&&t.commercial!=='lost'?5:0;
 const penalty=e.remaining<0?Math.round(12+Math.min(26,Math.abs(e.remaining)*.4)):e.remaining<20?Math.round((20-e.remaining)*.40):0;
 const contractPenalty=t.commercial==='lost'?16:t.commercial==='at-risk'?6:t.commercial==='conditional'?3:0;
 const fragile=m.service<53?Math.round((53-m.service)*.5):0;
 let total=operating+intelligence+mandateBonus-penalty-contractPenalty-fragile;
 const ceilings=[];
 if(t.commercial==='lost')ceilings.push({value:59,reason:'A lost flagship renewal limits the overall outcome.'});
 if(e.remaining<0)ceilings.push({value:55,reason:'The authorised recovery budget has been exceeded.'});
 if(m.service<40)ceilings.push({value:56,reason:'Core service continuity is critically weak.'});
 if(t.commercial==='lost'&&e.remaining<0)ceilings.push({value:40,reason:'Both the renewal and funding position have failed.'});
 if(ceilings.length)total=Math.min(total,...ceilings.map(x=>x.value));
 return {operating,intelligence,mandateBonus,penalty,contractPenalty,fragile,total:Math.round(clamp(total,0,100)),ceiling:ceilings.sort((a,b)=>a.value-b.value)[0]?.reason||null};
}
function score(t){return scoreBreak(t).total;}
function businessOutcome(t){const m=t.m;

 if(t.commercial==='renewed'&&m.service>=75&&m.client>=76&&m.cash>=15)return ['THE CLIENT WHISPERERS','The most valuable customer stayed, and delivery earned the promise you made.'];

 </div><div class="fa-receipt-side"><span class="fa-section-label">BOARDROOM EXHIBIT 01</span><h3>No imaginary profits.<br>No invisible costs.</h3><p>This receipt uses the recorded six-round ledger. The £${CLIENT_CONTRACT}k annual client contract is future commercial value, not money added to the £${START}k recovery fund.</p><div class="fa-fact"><span>UNAVOIDABLE RESPONSE COMMITMENTS</span><b>£${e.overhead}k</b></div><div class="fa-fact"><span>DECISIONS, SERVICES AND LIABILITIES</span><b>£${e.choices}k</b></div><div class="fa-fact"><span>CONTRACT OUTCOME</span><b>${X(flag.title)}</b></div><p class="fa-smallprint">Costs are simulated 90-day commitments, not claims that every invoice was paid during the five-day story.</p><button class="fa-outline" type="button" data-act="final-print">PRINT THIS VERDICT</button></div></div>`;
}
function finaleEvidence(t,all){
 const b=scoreBreak(t),r=businessOutcome(t),analysis=narrative(t),exposures=Object.entries(t.exposure).sort((a,b)=>b[1]-a[1]);
 return `<div class="fa-evidence"><div class="fa-evidence-lead"><div><span class="fa-section-label">CASE FILE / RECONSTRUCTED FROM ACTUAL DECISIONS</span><h3>${X(r[0])}</h3><p>${X(r[1])}</p></div><div class="fa-evidence-score">${t.score}<small>/100</small></div></div>
 <div class="fa-evidence-narrative">${analysis.map(v=>`<p>${X(v)}</p>`).join('')}<p><b>HEAD TO HEAD:</b> ${X(juxtapose(t,all.find(x=>x.id!==t.id)))}</p></div>
 <details class="fa-technical"><summary>Full decision and consequence timeline</summary><ol class="tape">${t.log.map((l,i)=>receiptHTML(t,l,i)).join('')}</ol></details>
 <details class="fa-technical"><summary>How the score was calculated</summary><div class="fa-score-break"><div>Operating performance <b>${b.operating}</b></div><div>Adviser intelligence <b>+${b.intelligence}</b></div><div>Mandate bonus <b>+${b.mandateBonus}</b></div><div>Financial penalty <b>−${b.penalty}</b></div><div>Contract penalty <b>−${b.contractPenalty}</b></div><div>Service penalty <b>−${b.fragile}</b></div></div><div class="fa-exposure-list">${exposures.map(([k,v])=>`<span>${X(k)}: <b>${v}/100</b></span>`).join('')}</div></details>
 </div>`;
}
function final(){
 const verdict=championshipResult(S.teams),all=verdict.all,best=verdict.leader,champion=verdict.champion;
 if(!S.finalReveal){page(`<main class="screen fa-final">
 <section class="cinema-entry fa-curtain" aria-label="Final verdict introduction"><div class="fa-curtain-wash"></div><div class="fa-curtain-content"><div class="fa-red-time"><span></span> THE 09:17 INCIDENT / FIVE DAYS LATER</div><div class="fa-curtain-icon" aria-hidden="true">⚖</div><h1>THE BOARD<br><em>HAS DECIDED.</em></h1><p>Six episodes. The same crisis. Different decisions. There is no hiding behind the spreadsheet now.</p><button type="button" class="fa-enter" data-act="final-unseal">REVEAL THE VERDICT <span>→</span></button></div><div class="fa-curtain-foot">NORTHLINE ADVISORY · CLOSED-DOOR BOARD REVIEW <span>CASE FILE 09:17</span></div></section></main>`);return;}
 const selected=all.find(t=>t.id===S.finalTeam)||(champion||best),tab=S.finalTab||'story';const winnerTie=verdict.joint.length>1;
 const flag=finaleFlag(champion||best),e=economics(champion||best);
 const heroLabel=champion?(winnerTie?'THE JOINT BOARDROOM CHAMPIONS':'THE BOARDROOM CHAMPION'):'NO BOARDROOM CHAMPION';
 const heroName=champion?verdict.joint.map(t=>t.name).join(' & '):'THE RENEWAL REMAINS UNSECURED';
 const heroValue=champion?champion.score:verdict.joint.length;
 const heroUnit=champion?'OUT OF 100':'TEAMS QUALIFIED';
 const heroNote=champion?('The £240k annual renewal was signed, response funding stayed within authorisation and delivery remained viable. '+(best.id!==champion.id?best.name+' scored more points, but did not meet the championship conditions.':'')):('No team secured the £240k annual renewal while meeting the cash and delivery conditions. '+best.name+' led the performance scores with '+best.score+'/100, but leading on points is not a business recovery victory.');
 page(`<main class="screen fa-final"><section class="cinema-entry fa-final-hero"><div class="fa-curtain-wash"></div><div class="fa-final-hero-content"><div class="fa-red-time"><span></span> CASE 09:17 / THE FINAL REVEAL</div><h1>THE BOARDROOM<br><em>RECKONING.</em></h1><p>The numbers are in. The promises have come due. Who survived the week — and at what cost?</p><div class="fa-golden-line"></div><div class="fa-win-label">${X(heroLabel)}</div><div class="fa-win-name">${X(heroName)}</div><div class="fa-win-metric"><b>${heroValue}</b><span>${X(heroUnit)}</span></div><div class="fa-win-note">${X(heroNote)}</div></div><div class="fa-curtain-foot">${X(award(best))}<span>REVIEW COMPLETE</span></div></section>
 <div class="fa-section-head"><span>01 / THE PODIUM</span><h2>Same crisis. Very different exits.</h2><p>Scores compare operational performance. The championship is awarded only when the annual renewal is signed, the response fund is not exceeded and client delivery remains viable. A high score alone cannot win.</p></div>
 ${finalePodium(all,champion)}
 <div class="fa-newsflash"><div class="fa-newsflash-label">09:17 NEWSWIRE / BOARDROOM AFTERMATH</div><div class="fa-newsflash-body">${X(highlightLine(best))}</div></div>
 <section class="fa-casework"><div class="fa-section-head"><span>02 / THE EVIDENCE</span><h2>Open their case files.</h2><p>These aren't generic endings. Each receipt, decision and exposure comes from that team's actual choices.</p></div>
 <div class="fa-team-select" role="group" aria-label="Choose a team to inspect">${all.map(t=>`<button type="button" data-final-team="${t.id}" class="${selected.id===t.id?'active':''}" aria-pressed="${selected.id===t.id}"><strong>${X(t.name)}</strong><span>${t.score} points</span></button>`).join('')}</div>
 <div class="fa-case-heading"><div><span>DECLASSIFIED // FILE ${String(selected.id+1).padStart(2,'0')}</span><h3>${X(selected.name)}</h3><p>${X(award(selected))}</p></div><div class="fa-score-mark">${selected.score}<small>/100</small></div></div>
 <div class="fa-tabs" role="group" aria-label="Case file views"><button type="button" data-final-tab="story" class="${tab==='story'?'active':''}" aria-pressed="${tab==='story'}">THE STORY</button><button type="button" data-final-tab="receipt" class="${tab==='receipt'?'active':''}" aria-pressed="${tab==='receipt'}">THE RECEIPT</button><button type="button" data-final-tab="evidence" class="${tab==='evidence'?'active':''}" aria-pressed="${tab==='evidence'}">FULL EVIDENCE</button></div>
 <div class="fa-tab-content" aria-live="polite">${tab==='receipt'?finaleReceipt(selected):tab==='evidence'?finaleEvidence(selected,all):finaleStory(selected,all)}</div></section>
 <section class="fa-close"><span>03 / THE DEBRIEF</span><h2>Would you make<br><em>the same call again?</em></h2><p>What did your team protect? What did it sacrifice? And which promise came back to haunt you?</p><div class="fa-close-actions"><button type="button" class="fa-enter" data-act="replay">RUN THE CRISIS AGAIN <span>↻</span></button><button type="button" class="fa-outline" data-act="report">${S.report?'HIDE FULL REPORT':'OPEN THE FACILITATOR REPORT'}</button></div>${S.report?`<div class="fa-download"><textarea readonly aria-label="Copyable full financial and decision report">${X(reportText())}</textarea><button class="fa-outline" type="button" data-act="download">DOWNLOAD REPORT (.TXT)</button></div>`:''}</section></main>`);
}

function reportText(){const verdict=championshipResult(S.teams);return 'BUSINESS CRISIS / THE 09:17 INCIDENT · V1.0 RC\nCHAMPIONSHIP: '+(verdict.champion?verdict.champion.name+' (renewal signed, funded, service viable)':'NO CHAMPION — no team met the commercial, funding and delivery conditions')+'\nSCORE LEADER: '+verdict.leader.name+' ('+verdict.leader.score+'/100)\n\n'+[...S.teams].sort((a,b)=>b.score-a.score).map(t=>{const e=economics(t);return `${t.name} — ${t.score} pts\n${businessOutcome(t).join(': ')}\nBudget committed: £${e.spent}k; budget left: £${e.remaining}k; composite risk: ${t.m.risk}\nContract: ${t.commercial}\n\n${narrative(t).join('\n\n')}\n\nDECISION HISTORY\n${t.log.map((l,i)=>`${i+1}. ${l.round}: ${l.choice}\n${receipt(t,l,i).read}\nBUDGET MOVEMENT: £${receipt(t,l,i).cashSpent}k allocated or reserved (including £${receipt(t,l,i).overhead}k baseline)\nMETRICS: ${receipt(t,l,i).movement.map(v=>`${v.name} ${signAmount(v.value)}`).join('; ')}\n${l.events.join(' ')}`).join('\n\n')}`}).join('\n\n------\n\n');}
function render(){if(S.phase==='home')intro();else if(S.phase==='setup')setup();else if(S.phase==='brief')briefingPage();else if(S.phase==='turn')turn();else if(S.phase==='recap')recap();else if(S.phase==='final')final();}
function start(){S.phase='home';fillTeams();render()}
document.addEventListener('input',e=>{if(e.target.matches('[data-pid]')){let p=S.players.find(p=>p.id===Number(e.target.dataset.pid));if(p){p.name=e.target.value;const tp=S.teams.find(t=>t.members.some(x=>x.id===p.id));if(tp){let match=tp.members.find(x=>x.id===p.id);match.name=p.name;}}}else if(e.target.matches('[data-custom]')){S.teams[Number(e.target.dataset.custom)].name=e.target.value;const go=document.querySelector('[data-act="brief"]');if(go)go.disabled=S.teams.some(t=>!t.members.length)||!teamNamesValid();}});
document.addEventListener('change',e=>{if(e.target.id==='teamcount'){S.count=Number(e.target.value);fillTeams();render()}else if(e.target.matches('[data-tname]')){const t=S.teams[Number(e.target.dataset.tname)];t.name=e.target.value==='custom'?'MY TEAM':e.target.value;render()}else if(e.target.matches('[data-mandate]')){S.teams[Number(e.target.dataset.mandate)].mandate=e.target.value;render()}else if(e.target.matches('[data-move]')){const id=Number(e.target.dataset.move),dest=Number(e.target.value);let p=S.players.find(x=>x.id===id);for(const t of S.teams)t.members=t.members.filter(x=>x.id!==id);S.teams[dest].members.push(p);render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.closest('#app'))return;const a=b.dataset.act;
if(a==='setup')S.phase='setup';else if(a==='addPlayer'){S.players.push(player(''));fillTeams()}else if(b.hasAttribute('data-remove')){S.players=S.players.filter(p=>p.id!==Number(b.dataset.remove));fillTeams()}else if(a==='shuffle')fillTeams(true);else if(a==='brief'){if(S.teams.some(t=>!t.members.length)||!teamNamesValid())return;S.phase='brief'}else if(a==='start'){S.phase='turn';S.r=0;S.turn=0;resetTurn()}else if(b.hasAttribute('data-role')){const i=Number(b.dataset.role);if(S.picks.includes(i))S.picks=S.picks.filter(v=>v!==i);else if(S.picks.length<2)S.picks.push(i)}else if(a==='confirm'){if(S.picks.length===2)S.confirmed=true;}else if(b.hasAttribute('data-choice'))S.choice=Number(b.dataset.choice);else if(b.hasAttribute('data-doc')){const i=Number(b.dataset.doc);if(!S.docs.includes(i))S.docs.push(i)}else if(b.hasAttribute('data-message')){const i=Number(b.dataset.message);if(S.messages.includes(i))S.messages=S.messages.filter(v=>v!==i);else if(S.messages.length<2)S.messages.push(i)}else if(b.hasAttribute('data-budget')){const id=b.dataset.budget,v=Number(b.dataset.inc);if(v>0&&(sum(S.alloc)>=5||S.alloc[id]>=2))return;S.alloc[id]=clamp(S.alloc[id]+v,0,2)}else if(a==='lock'){resolve();return}else if(a==='next'){if(S.r===5){S.phase='final';S.finalReveal=false;S.finalTeam=null;S.finalTab='story';}else{S.r++;S.turn=0;resetTurn();S.phase='turn'}}else if(a==='final-unseal'){S.finalReveal=true;S.finalTeam=[...S.teams].sort((x,y)=>y.score-x.score)[0]?.id;S.finalTab='story';}else if(b.hasAttribute('data-final-team')){S.finalTeam=Number(b.dataset.finalTeam);S.finalTab='story';}else if(b.hasAttribute('data-final-tab')){S.finalTab=b.dataset.finalTab;}else if(a==='final-print'){window.print();return;}else if(a==='replay'){S.finalReveal=false;S.finalTeam=null;S.finalTab='story';S.teams=S.teams.map(old=>{const t=newTeam(old.id);t.name=old.name;t.mandate=old.mandate;t.members=[...old.members];return t;});S.r=0;S.turn=0;resetTurn();S.variant=TWISTS[(TWISTS.indexOf(S.variant)+1+Math.floor(Math.random()*(TWISTS.length-1)))%TWISTS.length];S.phase='brief';S.report=false}else if(a==='report')S.report=!S.report;else if(a==='download'){const blob=new Blob([reportText()],{type:'text/plain'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='business-crisis-verdict.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),500);return;}render();});
start();
</script></body></html>
