const roles=[
{n:'PEOPLE & CULTURE',symbol:'P',signal:[2,2,0,0,2,1],lines:[
'Employees have already begun coordinating answers through an unofficial chat. The first message should state what is unknown and when the next verified update will come. Silence has a measurable morale cost.',
'There is capacity for only one employee-response queue without borrowing from Operations. A second support unit has diminishing returns unless the first has an owner.',
'HR has documented that the attachment was a draft, but cannot establish who configured the scheduler. People can describe impact, not technical responsibility.',
'HR has no new detail about the renewal terms. The account team reports fatigue, which may become a delivery issue later.',
'Employees are asking two specific questions: who can answer confidential concerns, and when will the next verified update arrive? Vague reassurance will not resolve either.',
'Employee confidence is still fragile. Recovery plans that promise culture change without an accountable support owner are likely to disappoint.']},
{n:'SYSTEMS & SECURITY',symbol:'S',signal:[2,1,2,1,0,2],lines:[
'The scheduled messaging workflow remains active. Isolating the affected template is possible without shutting down the entire email service, but a full freeze will interrupt customer communications.',
'One forensic unit will retrieve the send log and approvals; a second will unlock deeper service-account traces. Without technical funding, the internal audit will be shallow.',
'The archive version was delivered by a service account, not a named employee. A disabled second-approval check is suspected but needs forensic confirmation.',
'Engineering can preserve customer delivery, but a dedicated service pod will remove technical staff from incident review. There is a real capacity trade-off.',
'The release workflow can be adjusted later. Systems has no new evidence about how employees will interpret the town-hall wording.',
'The scheduler still allows archived content to publish without renewed human approval. Fixing the approval gate materially reduces recurrence risk.']},
{n:'CLIENT RELATIONS',symbol:'C',signal:[1,1,1,2,1,0],lines:[
'The three clients are not asking for a blanket apology; they need to know whether named delivery owners are still responsible for their contracts.',
'An account manager can call affected clients today, but a client-response unit cannot replace the operational staff needed to deliver their work.',
'Two procurement contacts said an independent review would improve their confidence. However, they will still assess actual service continuity.',
'The largest customer can accept a measurable continuity plan. It will not accept an unlimited promise of unchanged staffing, because that is not credible.',
'Client contacts may see the town-hall statement later. If it promises more than the service team can deliver, the inconsistency will be noticed.',
'Procurement has not sent a new request today. The urgent board question concerns structural prevention rather than another client reassurance round.']},
{n:'FINANCE & RISK',symbol:'F',signal:[0,2,1,2,0,2],lines:[
'The emergency response has a £190k authorised envelope. Finance cannot yet estimate any extra reporting or compensation cost; today’s immediate question is who needs a response.',
'Two specialists in the same department yield less additional value than the first. Spending across several departments preserves flexibility, but may dilute impact.',
'An external investigation can cost substantially more than an internal review, particularly if forensics already collected the necessary logs.',
'Performance-linked credits could preserve a £240k renewal, but trigger extra cash loss if service falls below the agreed threshold.',
'Finance has no new facts about how employees will receive the words. Any support promise should eventually have a funded owner.',
'Only the unspent cash reserve can fund the final recovery. A broad programme may produce good metrics but create a liquidity crisis.']},
{n:'LEGAL & COMPLIANCE',symbol:'L',signal:[0,0,2,1,1,1],lines:[
'At this moment there is no verified basis to accuse a particular employee of deliberate wrongdoing. Counsel needs a preserved audit trail, not a rushed attribution.',
'Legal has not identified an imminent filing deadline that would determine how to split today’s five response units. Preserve records as standard practice.',
'An automatically sent file is not evidence of deliberate sabotage. The approval register and system logs support an investigation into control failures, not an accusation.',
'Contract wording distinguishes measurable service commitments from absolute guarantees of future staffing. Any new promise needs a specific owner and limit.',
'The company may describe a draft as unapproved, but must not make sweeping promises that restructuring will never occur. Say what is known, not what is convenient.',
'Before any final controls programme, assign an identifiable approval owner and preserve a record of who authorised release.']},
{n:'COMMUNICATIONS',symbol:'M',signal:[1,0,0,0,2,0],lines:[
'An early holding message can reduce rumours if it names the next update time; a polished but unverified statement risks corrections later.',
'Public coverage is still minimal. Communications can monitor rumours, but has no unique information about the relative cost of resource units.',
'No major journalist has contacted the organisation. Communications cannot verify who approved the file or what the audit log means.',
'Public sentiment is stabilising. The customer is evaluating service reliability and contract protections rather than media coverage.',
'A short opening statement can carry only two memorable commitments. Use plain language and specific next steps rather than generic brand promises.',
'Media attention is low. The board is assessing governance and funding; Communications has no newly verified detail on either.']}
];
const briefingSignal=roundIdx=>roles.map((r,i)=>({i,level:r.signal[roundIdx]}));
const briefingResult=(selected,roundIdx)=>{
 const chosen=selected.map(i=>roles[i]);const critical=chosen.filter(r=>r.signal[roundIdx]===2).length;
 const relevant=chosen.filter(r=>r.signal[roundIdx]>0).length;
 const missed=roles.filter((r,i)=>r.signal[roundIdx]===2&&!selected.includes(i)).map(r=>r.n);
 return {critical,relevant,missed,selected:chosen.map(r=>r.n)};
};

['Hold an urgent staff town hall','Provides voice and reassurance, but creates information risks.',{cash:-11,staff:14,client:-4,evidence:-1,service:-5,risk:8},'townhall','Employees appreciate access, but questions exceed what you can verify.'],
['Seek a fast legal review before publishing','Reduces exposure, but gives rumours valuable time.',{cash:-13,staff:-4,client:1,evidence:6,service:0,risk:-13},'legal','Your eventual statement is well vetted. Staff still demand a faster timetable.']]},
{title:'SIX FIRES, FIVE RESOURCES',time:'MON 11:10',story:'Calls are piling up. You have five emergency-response units to allocate across six areas, with a maximum of two per department. Funding one area leaves another exposed.',quote:'CFO: “All six departments have asked for priority status. That is mathematically fascinating.”',kind:'allocate',question:'Where will you spend your five response units?'},
{title:'THE APPROVAL PUZZLE',time:'MON 15:05',story:'Technical logs implicate a scheduled job. HR insists the attachment was never approved. The board wants to know whether this was an accident, a control failure or deliberate misconduct.',quote:'Systems lead: “The server log is a better witness than half the conference room.”',kind:'evidence',question:'How should the company investigate and establish accountability?',options:[
['Commission an independent forensic investigation','Credibility and rigour, with a sizeable cost and service disruption.',{cash:-28,staff:-2,client:8,evidence:21,service:-6,risk:-11},'external','Independent investigators begin work. The review is strong but expensive.'],

['Invite an independent governance panel','Focuses on systemic control failures rather than only the technical root cause.',{cash:-20,staff:7,client:4,evidence:14,service:-7,risk:-12},'panel','The panel examines approval design and accountability.'],

['Audit the approval process first, then commission targeted specialist review','Cheaper than a full external review but slower to reach a comprehensive verdict.',{cash:-17,staff:1,client:4,evidence:17,service:-5,risk:-9},'hybrid','You pursue a focused audit, preserving some funds for later recovery.']]},

['Offer senior executive sponsorship','Protects the relationship, but places leadership capacity on the account.',{cash:-16,staff:1,client:14,evidence:0,service:-5,risk:-1},'sponsor','A director personally owns the account’s recovery.']]},

function dominant(t){const m=t.metrics;const values=[['people',m.staff],['client',m.client],['evidence',m.evidence],['operations',m.service],['finance',clamp(m.cash/INCOME*100,0,100)],['risk',100-m.risk]];return {strong:[...values].sort((a,b)=>b[1]-a[1])[0][0],weak:[...values].sort((a,b)=>a[1]-b[1])[0][0]};}
function decisionNarrative(t){const m=t.metrics,f=t.flags,ds=dominant(t),first=t.log[0]?.choice||'the initial response',allocation=t.log[1]?.choice||'the resource allocation';const sentences=[];
const intro={early:['You chose to speak before the entire picture was available','You traded complete certainty for the ability to reassure people quickly','Your opening move put speed of communication ahead of perfect verification'],contain:['You prioritised containment and verification over immediate reassurance','Your first instinct was to isolate the technical problem before addressing the people affected','You treated the email system as the first fire to contain'],clients:['You made customer continuity the first priority','You contacted commercial partners before leading the internal staff response','Your team saw protecting the three clients as the opening priority'],command:['You built a formal command structure before reacting','You invested early in coordination rather than sending a quick stand-alone statement','Your opening response put structured accountability ahead of speed'],townhall:['You opened a direct conversation with employees despite limited facts','You gave employees a live forum before the evidence was complete','You prioritised face-to-face reassurance despite unanswered questions'],legal:['You used legal scrutiny to shape the initial response','You accepted a slower initial response in exchange for counsel-led verification','You put legal review before public reassurance']};
sentences.push(variation(t,intro[f.first]||['You made a deliberate choice about the first response'],23)+'.');
if(t.allocation.forensics>=2)sentences.push('Two forensic units gave you deeper technical evidence and improved the value of later audit choices.');
if(!t.allocation.ops)sentences.push('No dedicated operational cover meant the crisis team borrowed capacity from ordinary delivery.');
if(!t.allocation.people&&!t.allocation.comms)sentences.push('Employee support was not funded, creating a predictable rumour and morale exposure.');
if(f.investigation==='internal')sentences.push(t.allocation.forensics>=2?'Your internal audit made good use of the forensic capacity you had already bought.':'Your low-cost internal audit had to work with limited specialist capacity.');
else if(f.investigation==='external')sentences.push('External investigators strengthened independence, but they used money that could not fund later recovery.');
else if(f.investigation==='preserve')sentences.push('Preserving evidence kept options open but pushed some governance questions into later rounds.');
else if(f.investigation==='panel')sentences.push('A governance panel shifted the focus from an individual culprit to the approval system.');
else if(f.investigation==='joint')sentences.push('Bringing HR and IT together improved shared understanding, though the board still had independence questions.');
else if(f.investigation==='hybrid')sentences.push('A targeted hybrid investigation traded some speed for a narrower and more cost-conscious external review.');
if(f.clientDeal==='credits')sentences.push(m.service<72?'Your performance-credit deal turned into a cash liability when service missed target.':'The performance-credit deal was affordable because you protected the delivery threshold.');
if(f.clientDeal==='dashboard')sentences.push(m.service<62?'Publishing service numbers made missed commitments impossible for the client to ignore.':'The service dashboard offered visible evidence instead of reassurance alone.');
if(f.clientDeal==='replan')sentences.push('Your renegotiated milestones favoured credible delivery over a more dramatic promise.');
if(f.clientDeal==='pod')sentences.push('A dedicated continuity team protected a key account but consumed scarce staff and funding.');
if(f.messages?.includes(1))sentences.push('The public support-line commitment cost money and placed additional demands on staff.');
if(f.messages?.includes(4))sentences.push('The oversight pledge increased expectations that the final governance plan would actually change.');
if(m.cash<0)sentences.push(`You finished £${Math.abs(m.cash)}k in deficit; that shortfall forces borrowing, a board cash injection or a narrower recovery plan.`);
else if(m.cash<28)sentences.push(`Only £${m.cash}k remained, leaving very little room for another surprise.`);
else if(m.cash>=75)sentences.push(`You retained £${m.cash}k in cash, preserving room for post-crisis repairs.`);
if(m.risk>=60)sentences.push(`Residual risk ended at ${m.risk}/100, so the board cannot reasonably declare the crisis closed.`);
else if(m.risk<=25)sentences.push(`Residual risk ended at ${m.risk}/100 — a substantial reduction, but not zero uncertainty.`);
else sentences.push(`Residual risk of ${m.risk}/100 means the process remains exposed to some follow-up work.`);
return {sentences,ds,first,allocation};}
function teamAward(t){const m=t.metrics,f=t.flags;if(m.cash<0)return variation(t,['THE CFO’S EMERGENCY MEETING','THE EXPENSIVE HEROES','THE OVERDRAFT OLYMPIANS'],9);if(m.evidence>=80&&m.client<65)return 'THE AUDIT WON, THE CLIENT LEFT';if(m.client>=84&&m.service<58)return 'THE CHARM WITHOUT THE DELIVERY';if(m.staff>=85&&m.service<55)return 'BEST CULTURE, WORST CALENDAR';if(m.risk<=26&&m.evidence>=70)return 'THE PARANOID PROFESSIONALS';if(m.cash>=80)return 'THE CASH GUARDIANS';if(f.clientDeal==='credits')return 'THE CONTRACT SMALL-PRINT READERS';if(m.service>=82)return 'THE DELIVERY RESCUERS';if(m.client>=80)return 'THE CLIENT WHISPERERS';return variation(t,['THE CRISIS JUGGLERS','THE BOARDROOM SURVIVORS','THE STRATEGIC IMPROVISERS'],8);}
function teamHeadline(t){const m=t.metrics,d=dominant(t),names={people:'THE PEOPLE DEFENDERS',client:'THE RELATIONSHIP NEGOTIATORS',evidence:'THE EVIDENCE ENGINE',operations:'THE DELIVERY FIXERS',finance:'THE COST CONTROLLERS',risk:'THE CONTROL ENGINEERS'};if(m.cash<0)return 'STRONG IDEAS. AN UNFUNDED ENDING.';if(m.service<45)return 'THE RECOVERY THAT MISSED DELIVERY';if(m.risk>60)return 'THE CRISIS STILL HAS TEETH';return names[d.strong]||'THE RESILIENT RESPONDERS';}
function teamJoke(t){const m=t.metrics,f=t.flags;const jokes=[];if(m.cash<0)jokes.push('The CFO has opened a spreadsheet called “WHO APPROVED THIS?”.',`Finance has requested that the next crisis be less expensive. Preferably free.`,`The board liked your optimism. The bank, less so.`);if(m.evidence>82)jokes.push('Your audit trail is now more organised than the company itself.','The IT team has asked for a relationship status with the server logs.');if(m.client>=82)jokes.push('The clients are considering sending you a thank-you card. Procurement is still negotiating the postage.','The account team has started calling this “customer diplomacy with casualties”.');if(m.service<52)jokes.push('The project calendar has quietly applied for compassionate leave.','Operations says the delivery schedule is now a work of speculative fiction.');if(m.staff<50)jokes.push('HR has placed a suggestion box next to the fire exit.','Someone printed “WE VALUE OUR PEOPLE” on the last working printer.');if(m.risk>=60)jokes.push('Compliance now sleeps beside the risk register.');if(f.first==='townhall')jokes.push('The town hall produced 400 questions and an impressive collection of muted microphones.');if(!jokes.length)jokes.push('An unusually calm week. The board suspects you are hiding another email.','Nobody resigned during the debrief. That counts as progress.','The CEO asked for a follow-up meeting, then remembered what happened last time.');return variation(t,jokes,11);}
function compare(t,all){const others=all.filter(o=>o.id!==t.id);const result=[];const pairs=[['staff','staff confidence'],['client','client trust'],['evidence','evidence quality'],['service','service delivery'],['cash','cash reserves']];for(const[k,name]of pairs){const max=Math.max(...all.map(x=>x.metrics[k]));if(t.metrics[k]===max){const tied=all.filter(x=>x.metrics[k]===max).length>1;result.push(`${tied?'Joint-best':'Best'} ${name} (${k==='cash'?'£':''}${t.metrics[k]}${k==='cash'?'k':''})`);}}const min=Math.min(...all.map(x=>x.metrics.risk));if(t.metrics.risk===min)result.push(all.filter(x=>x.metrics.risk===min).length>1?'Joint-lowest residual risk':'Lowest residual risk');return result;}
function teamAnalysis(t,all,rank){const m=t.metrics,ds=dominant(t),narr=decisionNarrative(t),versus=all.filter(o=>o.id!==t.id).sort((a,b)=>Math.abs(a.score-t.score)-Math.abs(b.score-t.score))[0],scores=scoreParts(t);const relative=versus?(t.score===versus.score?`You tied ${versus.name} at ${t.score} points. Compare their remaining budget and risk before calling it a draw.`:`You finished ${Math.abs(t.score-versus.score)} points ${t.score>versus.score?'ahead of':'behind'} ${versus.name}. ${m.cash-versus.metrics.cash>0?'You retained £'+(m.cash-versus.metrics.cash)+'k more cash.':m.cash<versus.metrics.cash?'You spent £'+(versus.metrics.cash-m.cash)+'k more than they did.':'Both sides retained the same cash reserve.'}`):'Single-team result.';const strongest=compare(t,all);const lowLabel={people:'employee confidence',client:'client trust',evidence:'verified evidence',operations:'delivery capacity',finance:'financial runway',risk:'risk control'}[ds.weak];const weightedImpact=l=>l.changes.staff*.17+l.changes.client*.18+l.changes.evidence*.18+l.changes.service*.17-l.changes.risk*.16+l.changes.cash*.14*100/INCOME;const sortedImpact=[...t.log].sort((a,b)=>weightedImpact(b)-weightedImpact(a));const best=sortedImpact[0],worst=sortedImpact[sortedImpact.length-1];const pivotal=`Your strongest immediate metric swing came from “${best.choice}” in ${best.round.toLowerCase()}. ${worst===best?'That decision was also your biggest trade-off.':`Your most expensive immediate trade-off was “${worst.choice}” in ${worst.round.toLowerCase()}.`} Delayed events are recorded separately in your decision trail.`;return {headline:teamHeadline(t),award:teamAward(t),joke:teamJoke(t),paragraphs:[narr.sentences.slice(0,2).join(' '),narr.sentences.slice(2,5).join(' '),narr.sentences.slice(5).join(' ')].filter(Boolean),watchpoint:`The weakest part of your final position was ${lowLabel}. ${m.cash<0?'Your immediate commercial priority would be a financing or scope-reduction decision.':m.risk>55?'The board should request another control review before signing off the crisis.':m.service<56?'Service recovery needs specific owners and measurable deadlines.':'The next management meeting should turn this exposure into a funded action plan.'}`,relative,strongest,pivotal,score:scores};}
function chart(all){const attrs=[['cash','Cash',190],['staff','Staff',100],['client','Clients',100],['evidence','Evidence',100],['service','Service',100],['risk','Risk',100]];return attrs.map(([key,name,limit])=>{const vals=all.map(t=>t.metrics[key]);const winner=key==='risk'?Math.min(...vals):Math.max(...vals);return `<div style="margin:16px 0"><b>${name}</b><span class="muted"> · ${key==='risk'?'lower is better':'higher is better'}</span>${all.map(t=>{const v=t.metrics[key];const span=key==='cash'?clamp(v/limit*100,0,100):v;return `<div class="barRow"><span>${X(t.name)}</span><div class="barRail"><i style="background:${colors[t.id]};width:${span}%"></i></div><b>${key==='cash'?'£':''}${v}${key==='cash'?'k':''}</b></div>`}).join('')}</div>`;}).join('');}
function renderFinal(){const sorted=[...state.teams].sort((a,b)=>b.score-a.score);const best=sorted[0],worst=sorted[sorted.length-1];root.innerHTML=lead('FINAL BOARDROOM REPORT','SIX ROUNDS. SIXTY WAYS TO REGRET AN EMAIL.','Your strategy changed the company — not just a score. Review the financial position, the chain of decisions and what competitors protected or sacrificed.',`Score spread: ${best.score-worst.score} points`)+`<div class="body"><section class="panel"><div class="eyebrow">THE VERDICT</div><h2>${best.score===worst.score?'It’s a tie. The board demands a rematch.':X(best.name)+' leads the boardroom.'}</h2><p class="bigtext">The average final score was ${Math.round(sorted.reduce((s,t)=>s+t.score,0)/sorted.length)}. ${sorted.filter(t=>t.metrics.cash<0).length} of ${sorted.length} teams finished with negative cash. A high trust score cannot finance a recovery programme.</p><div class="warning"><b>How scoring works:</b> operating metrics + achieved strategic mandate + adviser intelligence bonus − liquidity and operational penalties. A deficit is penalised in proportion to its size, not forced to the same score of 44.</div></section><div class="columns">${sorted.map((t,i)=>{const a=teamAnalysis(t,sorted,i),sp=a.score;return `<article class="reportCard ${i===0?'winner':''}"><div class="reportHeader"><div><div class="eyebrow">${i===0?'★ FIRST PLACE':'RANK '+(i+1)}</div><h2>${X(t.name)}</h2></div><div class="reportScore">${t.score}</div></div><span class="award">${X(a.award)}</span><h3>${X(a.headline)}</h3>${a.paragraphs.map(p=>`<p class="narrative">${X(p)}</p>`).join('')}<p class="muted"><b>Compared with your nearest rival:</b> ${X(a.relative)}</p><p class="muted"><b>Pivotal decisions:</b> ${X(a.pivotal)}</p><div class="warning"><b>Board's biggest concern:</b> ${X(a.watchpoint)}</div><div class="joke">${X(a.joke)}</div>${statHTML(t.metrics)}<p class="muted"><b>Strategic objective:</b> ${X(mandate(t).name)} · ${mandateMet(t)?'achieved (+8)':'not achieved'}</p><p class="muted"><b>Adviser intelligence:</b> ${t.log.reduce((s,l)=>s+l.briefing.relevant,0)}/12 relevant · ${t.log.reduce((s,l)=>s+l.briefing.critical,0)}/12 critical.</p><div class="panel" style="padding:12px;background:#f5f2eb;margin:12px 0"><div class="eyebrow">SCORE EXPLAINED</div>${[['Company performance',sp.operations],['Adviser intelligence',sp.intel],['Strategic objective',sp.mandateBonus],['Cash penalties',-sp.liquidity],['Instability',-sp.instability]].map(([label,v])=>`<div class="scoreLine"><span>${label}</span><b>${v>0?'+':''}${v}</b></div>`).join('')}</div>${a.strongest.length?`<p class="muted"><b>Category leaders:</b> ${X(a.strongest.join(' · '))}</p>`:''}</article>`}).join('')}</div><section class="panel"><div class="eyebrow">SIDE BY SIDE</div><h2>Who protected what?</h2><p class="muted">These scores compare end states; they are not a professional competency assessment. A category can be tied when teams have the same value.</p>${chart(sorted)}</section><section class="panel"><div class="eyebrow">THE CONSEQUENCE TRAIL</div><h2>How did we get here?</h2>${sorted.map(t=>`<details><summary>${X(t.name)} — six decisions and causal consequences</summary><ol>${t.log.map(l=>`<li style="margin:12px 0"><b>${X(l.round)}</b><p>${X(l.choice)}</p><p class="muted">${X(l.res)}</p>${l.events.map(e=>`<div class="warning">${X(e)}</div>`).join('')}<p class="muted">${Object.entries(l.changes).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v>0?'+':''}${v}`).join(' · ')}</p></li>`).join('')}</ol></details>`).join('')}</section><div class="grid2"><button class="btn primary" data-act="replay">PLAY AGAIN · NEW STRATEGIES ↻</button><button class="btn" data-act="report">${state.reportOpen?'HIDE':'SHOW'} DETAILED REPORT</button></div>${state.reportOpen?`<section class="panel"><label class="field-label">Select and copy the report</label><textarea class="reportArea" readonly>${X(makeReport())}</textarea><button class="btn" data-act="download">DOWNLOAD REPORT (.txt) ↓</button></section>`:''}<p class="footer">Decision outcomes are calculated by a rule-based simulation, not by an AI judging real employees. This version supports team play on one shared screen; individual phone joining and synchronized voting are not yet implemented.</p></div>`;}
function makeReport(){const all=[...state.teams].sort((a,b)=>b.score-a.score);return 'BUSINESS CRISIS v0.6 — THE 09:17 INCIDENT\n\n'+all.map((t,i)=>{const a=teamAnalysis(t,all,i),p=a.score;return `${i+1}. ${t.name} — ${t.score} points\n${a.headline}\nAward: ${a.award}\n\n${a.paragraphs.join('\n\n')}\n\nHead-to-head: ${a.relative}\nPivotal decisions: ${a.pivotal}\nBiggest concern: ${a.watchpoint}\nFun moment: ${a.joke}\nMandate: ${mandate(t).name} — ${mandateMet(t)?'achieved':'not achieved'}\nMetrics: ${JSON.stringify(t.metrics)}\nScore: performance ${p.operations} + intelligence ${p.intel} + mandate ${p.mandateBonus} - cash penalty ${p.liquidity} - instability ${p.instability}\n\n`+t.log.map((l,j)=>`${j+1}. ${l.round}: ${l.choice}\n${l.res}\n${l.events.join(' ')}\nEffect: ${JSON.stringify(l.changes)}`).join('\n\n');}).join('\n\n------------------\n\n');}
function render(){if(state.phase==='setup')renderSetup();else if(state.phase==='brief')renderBrief();else if(state.phase==='turn')renderTurn();else if(state.phase==='recap')renderRecap();else if(state.phase==='final')renderFinal();}
root.addEventListener('input',e=>{if(e.target.dataset.player){const p=state.players.find(p=>p.id===Number(e.target.dataset.player));if(p){p.name=e.target.value;}}if(e.target.dataset.custom!==undefined){const t=state.teams[Number(e.target.dataset.custom)];if(t){t.customName=e.target.value;t.name=e.target.value.trim()||chosenNames[t.id];}}});
root.addEventListener('change',e=>{if(e.target.id==='teamCount'){state.teamCount=Number(e.target.value);rebuildTeams();render();}if(e.target.dataset.move!==undefined){const id=Number(e.target.dataset.move),target=Number(e.target.value);const from=teamForPlayer(id);if(from){const player=from.members.find(p=>p.id===id);from.members=from.members.filter(p=>p.id!==id);state.teams[target].members.push(player);render();}}if(e.target.dataset.nameSelect!==undefined){const t=state.teams[Number(e.target.dataset.nameSelect)];t.nameMode=e.target.value==='custom'?'custom':'preset';t.name=t.nameMode==='custom'?(t.customName||chosenNames[t.id]):e.target.value;render();}if(e.target.dataset.mandate!==undefined){state.teams[Number(e.target.dataset.mandate)].mandate=e.target.value;render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;const a=b.dataset.act;
if(a==='add-player'){const player=mkPlayer('');state.players.push(player);const target=[...state.teams].sort((a,b)=>a.members.length-b.members.length)[0];target.members.push(player);render();const last=root.querySelector('[data-player="'+player.id+'"]');last?.focus();}
else if(b.dataset.remove!==undefined){const id=Number(b.dataset.remove);state.players=state.players.filter(p=>p.id!==id);state.teams.forEach(t=>t.members=t.members.filter(p=>p.id!==id));render();}
else if(a==='sample'){state.players=['Alex','Jamie','Sam','Priya','Taylor','Morgan','Casey','Rowan'].map(mkPlayer);rebuildTeams();render();}
else if(a==='shuffle'){rebuildTeams(true);render();}
else if(a==='begin'){const names=state.teams.map(t=>t.name.trim().toLowerCase());const message=state.teams.some(t=>!t.members.length)?'Every team needs at least one player.':state.players.some(p=>!p.name.trim())?'Please give each player a name.':new Set(names).size!==names.length?'Please give each team a unique name.':state.teams.some(t=>!t.name.trim())?'Please name each team.':'';if(message){const el=root.querySelector('#setupError');if(el)el.textContent=message;return;}state.phase='brief';render();}
else if(a==='start'){state.phase='turn';render();}
else if(a==='setup'){state.phase='setup';render();}
else if(b.dataset.role!==undefined){if(!state.adviserConfirmed){const i=Number(b.dataset.role);if(state.adviserPicks.includes(i))state.adviserPicks=state.adviserPicks.filter(k=>k!==i);else if(state.adviserPicks.length<2)state.adviserPicks.push(i);render();}}
else if(a==='confirm-advisers'){if(state.adviserPicks.length===2){state.adviserConfirmed=true;state.seenRoles=[...state.adviserPicks];render();}}
else if(b.dataset.doc!==undefined){const i=Number(b.dataset.doc);if(!state.seenDocs.includes(i))state.seenDocs.push(i);render();}
else if(b.dataset.choice!==undefined){state.selected=Number(b.dataset.choice);render();}
else if(b.dataset.dept!==undefined){const id=b.dataset.dept,delta=Number(b.dataset.step),total=Object.values(state.alloc).reduce((s,v)=>s+v,0);if(delta>0&&(total>=5||state.alloc[id]>=2))return;state.alloc[id]=clamp(state.alloc[id]+delta,0,2);render();}
else if(b.dataset.msg!==undefined){const i=Number(b.dataset.msg);if(state.messages.includes(i))state.messages=state.messages.filter(x=>x!==i);else if(state.messages.length<2)state.messages.push(i);render();}
else if(a==='lock'){commit();}
else if(a==='next'){if(state.r===5)state.phase='final';else{state.r++;state.turn=0;resetInputs();state.phase='turn';}render();}
else if(a==='replay'){state.r=0;state.turn=0;state.teams=state.teams.map(t=>({...t,metrics:freshMetrics(),flags:{},allocation:{},log:[],events:[],score:0,last:''}));state.phase='brief';state.reportOpen=false;state.sessionSeed=Math.floor(Math.random()*1000000);resetInputs();render();}
else if(a==='report'){state.reportOpen=!state.reportOpen;render();}
else if(a==='download'){const blob=new Blob([makeReport()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BUSINESS_CRISIS_Report_v06.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
});
rebuildTeams();render();
})();
