function mandateMet(t){const m=t.metrics;return t.mandate==='staff'?(m.staff>=74&&m.risk<=40):t.mandate==='client'?(m.client>=75&&m.service>=65):t.mandate==='evidence'?(m.evidence>=75&&m.risk<=33):(m.cash>=45&&m.service>=65)}
function score(t){const m=t.metrics,cash=Math.max(0,Math.min(100,m.cash/125*100));const raw=Math.round(m.staff*.20+m.client*.22+m.evidence*.18+m.service*.20+(100-m.risk)*.13+cash*.07+(mandateMet(t)?6:0)-(m.service<43?6:0)-(m.risk>60?6:0));return Math.max(0,m.cash<0?Math.min(44,raw-16-Math.ceil(Math.abs(m.cash)*.3)):m.cash<15?Math.min(59,raw-8):raw)}
function profile(t){const m=t.metrics,good=Object.entries({staff:m.staff,client:m.client,evidence:m.evidence,service:m.service,cash:Math.min(100,m.cash/125*100),risk:100-m.risk});good.sort((a,b)=>b[1]-a[1]);let best=good[0][0],worst=good[good.length-1][0];const titles={staff:'THE PEOPLE WHISPERERS',client:'THE CLIENT DIPLOMATS',evidence:'THE FORENSIC OWLS',service:'THE DELIVERY RESCUERS',cash:'THE SPREADSHEET NINJAS',risk:'THE RISK TAMERS'};const weak={staff:'HR is preparing an extremely long feedback form.',client:'The client has asked to speak to absolutely anyone else.',evidence:'The audit trail contains more mystery than a detective novel.',service:'Project delivery is held together with calendar invitations.',cash:'The CFO has opened a new tab called “Why?”.',risk:'The compliance officer is stress-eating the emergency biscuits.'};return{title:titles[best],best,worst,weak:weak[worst],description:`Your team prioritised ${({staff:'people',client:'customer relationships',evidence:'evidence and investigation',service:'operational continuity',cash:'financial discipline',risk:'risk reduction'})[best]}. The biggest vulnerability was ${({staff:'employee confidence',client:'client confidence',evidence:'verified evidence',service:'delivery capacity',cash:'financial runway',risk:'unresolved risk'})[worst]}.`}}
function award(t){const m=t.metrics;if(m.cash<0)return'THE BUDGET BLACK HOLE';if(m.evidence>=83)return'BEST FRIENDS WITH THE AUDIT LOG';if(m.staff>=83)return'HR WOULD HIRE YOU AGAIN';if(m.client>=82)return'CLIENT CHARM OFFENSIVE';if(m.service>=83)return'THE CALENDAR CONQUERORS';if(m.risk<=18)return'MOST BORING IN A GOOD WAY';return'MASTER OF MANAGED CHAOS'}
function hero(over,title,lead){return `<div class="hero"><div class="over">${X(over)}</div><h1>${title}</h1><p class="lead">${X(lead)}</p></div>`}
function statBoxes(m){return `<div class="stats">${[['Cash',m.cash<0?'−£'+Math.abs(m.cash)+'k':'£'+m.cash+'k'],['Staff',m.staff],['Clients',m.client],['Evidence',m.evidence],['Service',m.service],['Risk',m.risk]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`}
function renderSetup(){root.innerHTML=hero('BUSINESS CRISIS · COMPETITIVE EDITION','THE 09:17 INCIDENT','A confidential email. Six hundred anxious employees. Three worried clients. Competing teams, competing priorities — and no perfect answers.')+`<div class="body"><div class="grid"><section class="panel"><div class="eyebrow">Create a session</div><h2>Set up the teams</h2><label>Number of teams<select class="field" id="teamCount">${[2,3,4].map(n=>`<option value="${n}" ${state.teamCount===n?'selected':''}>${n} teams</option>`).join('')}</select></label><label>Player names<textarea id="players" class="field" rows="3">${X(state.players)}</textarea></label><label>Team names (optional)<input id="teamNames" class="field" value="${X(state.names)}" placeholder="Team Orbit, Team Forge"></label><button class="btn" data-act="shuffle">Shuffle participants ↻</button><p class="muted">Leave names empty to generate sample players.</p></section><section class="panel"><div class="eyebrow">What's new in v0.5</div><h2>More ways to win. More ways to regret it.</h2><p>Six possible strategies per decision round. Six investment areas. Two commitments chosen from six possibilities.</p><p><b>New: choose two of six advisers each round.</b> Four have relevant information. Two are lower priority. You only find out after committing.</p><p>Every team starts from the same conditions, but follows its own strategic mandate.</p><div class="hint">Shared-screen competition: one facilitator enters each team's decisions. Private, live voting from separate phones is a future feature, not active here.</div></section></div><section class="panel"><div class="eyebrow">Players & mandates</div>${state.teams.map(t=>`<div class="team"><div class="top"><b><i class="dot" style="background:${colors[t.id]}"></i>${X(t.name)}</b><span class="tag">${t.members.length} players</span></div><div>${t.members.map(p=>`<span class="pill">${X(p)} <select data-move="${X(p)}"><option value="${t.id}">✓</option>${state.teams.filter(x=>x.id!==t.id).map(x=>`<option value="${x.id}">→ ${X(x.name)}</option>`).join('')}</select></span>`).join('')}</div><label>Strategic objective<select class="field" data-mandate="${t.id}">${mandates.map(m=>`<option value="${m.id}" ${t.mandate===m.id?'selected':''}>${X(m.name)}</option>`).join('')}</select></label><p class="muted">${X(mandate(t).description)}</p></div>`).join('')}<button class="btn primary" data-act="begin">START THE TEAM CHALLENGE →</button></section></div>`}
function renderBrief(){root.innerHTML=hero('MISSION BRIEFING','A VERY BAD MONDAY','Northline Advisory accidentally released an unapproved restructuring proposal. Your task: protect the company without sacrificing everything else.')+`<div class="body"><div class="panel"><div class="eyebrow">How to play</div><h2>The rules are simple. The decisions aren't.</h2><p class="mutedstrong">Each team starts with the same £125,000 emergency cash, company performance and crisis. Discuss your options. In each round, you may consult exactly TWO of SIX advisers. Only four hold actionable information for that particular situation. Choose wisely: the other two are honest, but might not help you decide.</p><p>Each game contains six rounds. Your choices persist and may come back in the final round. Some choices only become valuable if you've made supporting investments earlier.</p><div class="hint">There is no universal perfect score. Protect your team's mandate without destroying the rest of the business.</div>${state.teams.map(t=>`<div class="team"><b>${X(t.name)}</b><p class="muted">${X(mandate(t).name)} — ${X(mandate(t).description)}</p></div>`).join('')}</div><button class="btn primary" data-act="start">BEGIN ROUND 1 →</button><button class="btn" data-act="setup">← Edit teams</button></div>`}
function isReady(){const r=questions[state.r],a=state.alloc;return state.seenRoles.length===2&&(r.kind==='allocate'?Object.values(a).reduce((x,y)=>x+y,0)===5:r.kind==='message'?state.messages.length===2:r.kind==='evidence'?state.seenDocs.length>=2&&state.selected!==null:state.selected!==null)}
function optionsHTML(r,t){if(r.kind==='allocate')return `<p class="muted">Five resource units available. Up to two per department. Remaining: <b>${5-Object.values(state.alloc).reduce((a,b)=>a+b,0)}</b></p>${departments.map(d=>`<div class="alloc"><div><b>${X(d.name)}</b><div class="muted">${X(d.detail)} · £${d.cost}k/unit</div></div><div class="counter"><button data-dept="${d.id}" data-step="-1" aria-label="Remove ${X(d.name)}">−</button><b>${state.alloc[d.id]}</b><button data-dept="${d.id}" data-step="1" aria-label="Add ${X(d.name)}">+</button></div></div>`).join('')}`;
let out='';if(r.kind==='evidence'){const docs=[...clues];if(t.allocation.forensics>=2)docs.push(['ENHANCED FORENSIC TRACE','Earlier forensic spending uncovered a disabled second-approver check on the scheduled workflow.']);out=`<div class="eyebrow">Investigate at least two documents</div>${docs.map((c,i)=>`<button class="btn ${state.seenDocs.includes(i)?'sel':''}" data-doc="${i}"><span class="opt"><strong>${X(c[0])}</strong><small>${state.seenDocs.includes(i)?X(c[1]):'Open this evidence'}</small></span></button>`).join('')}`}
if(r.kind==='message')return `<p class="muted">Choose TWO commitments. ${state.messages.length}/2 selected.</p>${r.options.map((o,i)=>`<button class="btn ${state.messages.includes(i)?'sel':''}" data-msg="${i}"><span class="key">${state.messages.includes(i)?'✓':String.fromCharCode(65+i)}</span><span class="opt"><strong>${X(o[0])}</strong><small>${X(o[1])}</small></span></button>`).join('')}`;
return out+r.options.map((o,i)=>`<button class="btn ${state.selected===i?'sel':''}" data-choice="${i}"><span class="key">${String.fromCharCode(65+i)}</span><span class="opt"><strong>${X(o[0])}</strong><small>${X(o[1])}</small></span></button>`).join('')}
function renderTurn(){const t=state.teams[state.turn],r=questions[state.r];root.innerHTML=hero(`ROUND ${state.r+1} / 6 · ${r.time}`,X(r.title),r.story)+`<div class="body"><div class="progress"><i style="width:${state.r/6*100}%"></i></div><div class="team"><div class="top"><b><i class="dot" style="background:${colors[t.id]}"></i>${X(t.name)}</b><span class="tag">Team ${state.turn+1} of ${state.teams.length}</span></div><p class="muted">${t.members.map(X).join(' · ')}</p>${statBoxes(t.metrics)}<div class="muted">Objective: ${X(mandate(t).description)}</div></div><div class="quote">“${X(r.quote)}”</div><div class="panel"><div class="eyebrow">CHOOSE TWO. CHOOSE WISELY. · ${state.seenRoles.length}/2 CONSULTED</div><p class="mutedstrong">Six specialists. Four have useful insights into this particular problem. You only have time to speak with two. Choose based on the crisis, not habit.</p><div class="grid">${roles.map((a,i)=>`<button class="role ${state.seenRoles.includes(i)?'open':''}" data-role="${i}" ${state.seenRoles.length>=2&&!state.seenRoles.includes(i)?'disabled':''}><b>${a.symbol} · ${a.n}</b><p>${state.seenRoles.includes(i)?X(a.lines[state.r]):state.seenRoles.length>=2?'Consultation slots used':'Consult this specialist (uses one slot)'}</p></button>`).join('')}</div></div><div class="panel"><div class="eyebrow">YOUR TEAM'S TASK</div><div class="question">${X(r.question)}</div>${optionsHTML(r,t)}<button class="btn primary" data-act="lock" ${isReady()?'':'disabled'}>LOCK TEAM DECISION →</button><p class="muted">The consequences will be shown after every team has decided.</p></div></div>`}
function resetInputs(){state.seenRoles=[];state.seenDocs=[];state.selected=null;state.messages=[];state.alloc=Object.fromEntries(departments.map(d=>[d.id,0]))}
function commit(){if(!isReady())return;const t=state.teams[state.turn],r=questions[state.r],m=t.metrics;const changes={},events=[];let choice='',res='';const base=[{}, {staff:-5,client:-4,service:-4,risk:5},{service:-3,client:-2},{client:-7,cash:-8},{staff:-6,client:-3,service:-2},{risk:4,service:-5}];add(changes,base[state.r]);
if(r.kind==='allocate'){choice=departments.filter(d=>state.alloc[d.id]).map(d=>`${d.name} × ${state.alloc[d.id]}`).join('; ');t.allocation={...state.alloc};for(const d of departments){for(let i=0;i<state.alloc[d.id];i++){for(const[k,v]of Object.entries(d.d))changes[k]=(changes[k]||0)+Math.round(v*(i?0.7:1));changes.cash=(changes.cash||0)-d.cost}}
if(!state.alloc.people&&!state.alloc.comms){add(changes,{staff:-10,risk:7});events.push('No employee communications team: rumours accelerate.')}if(!state.alloc.ops){add(changes,{service:-7});events.push('No operational cover: existing work slows.')}if(state.alloc.forensics>=2){add(changes,{evidence:4,risk:-3});events.push('A dedicated forensic unit uncovers additional records.')}res='Your investment pattern creates strengths in some areas and leaves others exposed.'}
else if(r.kind==='message'){choice=state.messages.map(i=>r.options[i][0]).join(' + ');t.flags.messages=[...state.messages];for(const i of state.messages)add(changes,r.options[i][2]);res='The announcement creates public commitments and shapes what stakeholders expect.';if(state.messages.includes(3)&&m.evidence<50){add(changes,{staff:-5,risk:3});events.push('A 48-hour update is difficult with incomplete evidence.')}if(state.messages.includes(4)&&t.flags.investigation==='panel'){add(changes,{risk:-4});events.push('Your governance panel strengthens the oversight commitment.')}}
else {const o=r.options[state.selected];choice=o[0];add(changes,o[2]);res=o[4];if(state.r===0)t.flags.first=o[3];if(state.r===2){t.flags.investigation=o[3];if(o[3]==='internal'&&t.allocation.forensics>=2){add(changes,{evidence:8,risk:-4});events.push('Funded forensic capacity makes the internal audit stronger.')}if(o[3]==='internal'&&!t.allocation.forensics){add(changes,{evidence:-6,risk:5});events.push('Insufficient forensic capacity weakens the internal review.')}if(o[3]==='external'&&m.evidence>=65){add(changes,{evidence:-5});events.push('External work duplicates evidence already collected.')}if(t.flags.first==='early'&&m.evidence<55){add(changes,{staff:-6,client:-5,risk:5});events.push('Your early statement requires correction.')}if(t.flags.first==='early'&&m.evidence>=55){add(changes,{staff:3,client:4});events.push('Your early statement holds up to scrutiny.')}}if(state.r===3){t.flags.clientDeal=o[3];if(o[3]==='pod'&&t.allocation.ops>=2){add(changes,{service:5,staff:2});events.push('Earlier operations spending supports the protected client team.')}if(o[3]==='dashboard'&&m.evidence>=63){add(changes,{client:6,risk:-3});events.push('The evidence-backed dashboard reassures procurement.')}}if(state.r===5){t.flags.final=o[3];if(t.flags.clientDeal==='credits'&&m.service<72){add(changes,{cash:-20,client:-7,risk:5});events.push('Service-credit penalty: performance fell below contractual target.')}if(t.flags.clientDeal==='credits'&&m.service>=72){add(changes,{client:5});events.push('Service credits were not triggered: your service held.')}if(t.flags.first==='clients'&&!t.allocation.people&&!t.allocation.comms){add(changes,{staff:-8});events.push('The early staff communication gap was never fully repaired.')}if(t.flags.investigation==='preserve'&&m.evidence<61){add(changes,{risk:7,client:-4});events.push('Deferred investigation leaves questions unanswered.')}if(m.staff<45){add(changes,{service:-7,risk:6});events.push('Low staff confidence now undermines delivery capacity.')}if(t.flags.first==='command'&&o[3]==='balanced'){add(changes,{service:3});events.push('The early command structure makes a broader plan easier to coordinate.')}}}
for(const[k,v]of Object.entries(changes))changes[k]=Math.round(v);effect(m,changes);t.score=score(t);t.events.push(...events);t.log.push({round:r.title,choice,res,events:[...events],lesson:roundLessons[state.r],changes,briefing:briefingResult(state.seenRoles,state.r)});if(state.turn<state.teams.length-1){state.turn++;resetInputs()}else state.phase='recap';render()}
function renderRecap(){root.innerHTML=hero(`ROUND ${state.r+1} COMPLETE`,'THE FALLOUT','Different decisions have created different company realities. Some consequences will only appear later.')+`<div class="body"><div class="grid">${state.teams.map(t=>{const l=t.log[state.r];return `<div class="panel"><div class="top"><b><i class="dot" style="background:${colors[t.id]}"></i>${X(t.name)}</b><span class="tag">${t.score} pts</span></div><p><b>${X(l.choice)}</b></p><p>${X(l.res)}</p>${l.events.map(e=>`<div class="hint">${X(e)}</div>`).join('')}${statBoxes(t.metrics)}</div>`}).join('')}</div><div class="panel"><div class="eyebrow">ADVISER DEBRIEF · WHO DID YOU ASK?</div>${state.teams.map(t=>{const b=t.log[state.r].briefing;return `<p><b>${X(t.name)}</b> consulted ${X(b.selected.join(" + "))}: <strong>${b.relevant}/2 relevant</strong>, ${b.critical}/2 critical insights. ${b.missed.length?`Missed high-impact voices: ${X(b.missed.join(" & "))}.`:"You heard both high-impact perspectives."}</p>`}).join("")}<p class="muted">The two less relevant advisers did not lie — their information simply mattered less to this round. Different rounds favour different specialists.</p></div><div class="hint"><b>What this round teaches:</b> ${X(roundLessons[state.r])}</div><button class="btn primary" data-act="next">${state.r===5?'REVEAL THE FINAL VERDICT':'CONTINUE TO ROUND '+(state.r+2)} →</button></div>`}
function narrativeCompare(t,others){const m=t.metrics,leader=(key)=>Math.max(...others.map(x=>x.metrics[key])),lowest=(key)=>Math.min(...others.map(x=>x.metrics[key]));let wins=[];for(const key of ['staff','client','evidence','service','cash'])if(m[key]===leader(key))wins.push(key);if(m.risk===lowest('risk'))wins.push('risk');let difference=wins.length?`You led the room in ${wins.map(x=>x==='cash'?'cash reserves':x==='risk'?'risk control':x).join(', ')}.`:'You did not top a single category, but a balanced approach can still win.';return difference}
function renderFinal(){const sorted=[...state.teams].sort((a,b)=>b.score-a.score),leader=sorted[0],mean=Math.round(sorted.reduce((a,t)=>a+t.score,0)/sorted.length);const statKeys=[['cash','Cash'],['staff','Staff'],['client','Clients'],['evidence','Evidence'],['service','Service'],['risk','Risk']];root.innerHTML=hero('THE BOARDROOM VERDICT','SAME CRISIS. DIFFERENT COMPANIES.','The board has reviewed every strategy. Your score matters — but the decisions behind it make the better story.')+`<div class="body"><div class="panel"><div class="eyebrow">COMPETITION SUMMARY</div><div class="smallgrid"><div class="smallbox"><div class="count">${sorted.length}</div><span class="muted">Teams</span></div><div class="smallbox"><div class="count">${mean}</div><span class="muted">Average score</span></div><div class="smallbox"><div class="count">${leader.score-sorted[sorted.length-1].score}</div><span class="muted">Score spread</span></div></div><p class="mutedstrong">${X(leader.name)} has the highest score (${leader.score}). ${sorted.some(t=>t.metrics.cash<0)?'Warning: teams with negative cash require recapitalisation; good stakeholder scores cannot erase insolvency.':'Every team remained solvent.'} No single score tells the whole story.</p></div><div class="results">${sorted.map((t,i)=>{const p=profile(t),m=t.metrics;return `<div class="resultCard"><div class="top"><b>${i===0?'★ ':''}${i+1}. ${X(t.name)}</b><b style="font-size:23px">${t.score}</b></div><p><span class="award">${X(award(t))}</span></p><h2>${X(p.title)}</h2><p>${X(p.description)}</p><p class="mutedstrong">${X(narrativeCompare(t,sorted))}</p><p class="muted">${X(p.weak)}</p><p class="muted"><b>Adviser instinct:</b> ${t.log.reduce((n,l)=>n+l.briefing.relevant,0)}/12 relevant consultations · ${t.log.reduce((n,l)=>n+l.briefing.critical,0)}/12 critical insights uncovered.</p>${statBoxes(m)}<div class="tag">Strategic mandate: ${mandateMet(t)?'ACHIEVED (+6 pts)':'not achieved'}</div></div>`}).join('')}</div><div class="panel"><div class="eyebrow">HEAD-TO-HEAD COMPARISON</div><h2>Who was actually best at what?</h2>${statKeys.map(([key,label])=>{const best=(key==='risk'?Math.min:Math.max)(...sorted.map(t=>t.metrics[key]));const leaders=sorted.filter(t=>t.metrics[key]===best).map(t=>t.name).join(' & ');return `<div style="margin:15px 0"><b>${label}</b><span class="muted"> · ${X(leaders)} ${key==='risk'?'has the lowest risk':'leads'}</span>${sorted.map(t=>{const v=t.metrics[key];const width=key==='cash'?Math.max(0,Math.min(100,v/125*100)):key==='risk'?100-v:v;return `<div class="barrow"><span style="font-size:11px">${X(t.name)}</span><span class="rail"><i style="width:${width}%;background:${colors[t.id]}"></i></span><b>${key==='cash'?'£':''}${v}${key==='cash'?'k':''}</b></div>`}).join('')}</div>`}).join('')}</div><div class="panel"><div class="eyebrow">THE BOARD'S TAKEAWAY</div><h2>The expensive truth</h2><p>The incident began with a scheduling and approval failure. But the consequences depended on stakeholder choices, resource allocation and earlier investments. Most teams protected something successfully; the trick was what they had to sacrifice.</p><div class="hint">When teams choose differently, neither strategy needs to be stupid. A serious decision is one where capable people can disagree for defensible reasons.</div><div class="eyebrow">DECISION TRAILS</div>${sorted.map(t=>`<details><summary>${X(t.name)} — 6 decisions and consequences</summary><ol>${t.log.map(l=>`<li><b>${X(l.round)}</b><p>${X(l.choice)}</p><p class="muted">${X(l.res)} ${X(l.events.join(' '))}</p></li>`).join('')}</ol></details>`).join('')}</div><div class="grid"><button class="btn primary" data-act="replay">REPLAY WITH DIFFERENT STRATEGIES ↻</button><button class="btn" data-act="report">${state.reportOpen?'HIDE':'VIEW'} FULL REPORT</button></div>${state.reportOpen?`<div class="panel"><label>Results — select and copy<textarea class="reportArea" readonly>${X(makeReport())}</textarea></label></div>`:''}<p class="muted">An interactive simulation, not a test of individual professional competence. This is shared-screen team play, not yet live phone-based multiplayer.</p></div>`}
function makeReport(){const sorted=[...state.teams].sort((a,b)=>b.score-a.score);return 'BUSINESS CRISIS v0.5 — THE 09:17 INCIDENT\n\n'+sorted.map((t,i)=>`${i+1}. ${t.name} — ${t.score} points — ${profile(t).title}\n${profile(t).description}\nAward: ${award(t)}\nMandate: ${mandate(t).name} — ${mandateMet(t)?'Achieved':'Not achieved'}\nMetrics: ${JSON.stringify(t.metrics)}\n\n`+t.log.map((l,j)=>`${j+1}. ${l.round}\nChoice: ${l.choice}\nOutcome: ${l.res} ${l.events.join(' ')}\nLesson: ${l.lesson}`).join('\n\n')).join('\n\n-----------\n\n')}
function render(){if(state.phase==='setup')renderSetup();if(state.phase==='brief')renderBrief();if(state.phase==='turn')renderTurn();if(state.phase==='recap')renderRecap();if(state.phase==='final')renderFinal()}
root.addEventListener('input',e=>{if(e.target.id==='players')state.players=e.target.value;if(e.target.id==='teamNames')state.names=e.target.value});root.addEventListener('change',e=>{if(e.target.id==='teamCount'){state.teamCount=Number(e.target.value);prepare();render()}if(e.target.dataset.move!==undefined){const name=e.target.dataset.move,goal=Number(e.target.value);for(const t of state.teams){const i=t.members.indexOf(name);if(i>=0){t.members.splice(i,1);break}}state.teams[goal].members.push(name);render()}if(e.target.dataset.mandate!==undefined){state.teams[Number(e.target.dataset.mandate)].mandate=e.target.value;render()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;const a=b.dataset.act;if(a==='shuffle'){state.players=root.querySelector('#players')?.value??state.players;state.names=root.querySelector('#teamNames')?.value??state.names;prepare(true);render()}else if(a==='begin'){if(state.teams.some(t=>!t.members.length))return;state.phase='brief';render()}else if(a==='start'){state.phase='turn';render()}else if(a==='setup'){state.phase='setup';render()}else if(b.dataset.role!==undefined){const i=Number(b.dataset.role);if(!state.seenRoles.includes(i)&&state.seenRoles.length<2)state.seenRoles.push(i);render()}else if(b.dataset.doc!==undefined){const i=Number(b.dataset.doc);if(!state.seenDocs.includes(i))state.seenDocs.push(i);render()}else if(b.dataset.choice!==undefined){state.selected=Number(b.dataset.choice);render()}else if(b.dataset.dept!==undefined){const d=b.dataset.dept,step=Number(b.dataset.step),total=Object.values(state.alloc).reduce((x,y)=>x+y,0);if(step>0&&(total>=5||state.alloc[d]>=2))return;state.alloc[d]=Math.max(0,state.alloc[d]+step);render()}else if(b.dataset.msg!==undefined){const i=Number(b.dataset.msg);if(state.messages.includes(i))state.messages=state.messages.filter(j=>j!==i);else if(state.messages.length<2)state.messages.push(i);render()}else if(a==='lock'){commit()}else if(a==='next'){if(state.r===5)state.phase='final';else{state.r++;state.turn=0;resetInputs();state.phase='turn'}render()}else if(a==='replay'){state.r=0;state.turn=0;state.teams=state.teams.map(t=>team(t.id,t.name,[...t.members],t.mandate));state.phase='brief';state.reportOpen=false;resetInputs();render()}else if(a==='report'){state.reportOpen=!state.reportOpen;render()}});
prepare();render();
})();
</script></div></html>
