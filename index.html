</style></head><body><div id="app"></div><script>const roles=[
{n:'PEOPLE & CULTURE',symbol:'P',signal:[2,2,0,0,2,1],lines:[
'Employees have already begun coordinating answers through an unofficial chat. The first message should state what is unknown and when the next verified update will come. Silence has a measurable morale cost.',
'There is capacity for only one employee-response queue without borrowing from Operations. A second support unit has diminishing returns unless the first has an owner.',
'HR has documented that the attachment was a draft, but cannot establish who configured the scheduler. People can describe impact, not technical responsibility.',
'HR has no new detail about the renewal terms. The account team reports fatigue, which may become a delivery issue later.',
'Employees are asking two specific questions: who can answer confidential concerns, and when will the next verified update arrive? Vague reassurance will not resolve either.',
'Employee confidence is still fragile. Recovery plans that promise culture change without an accountable support owner are likely to disappoint.']},
{n:'SYSTEMS & SECURITY',symbol:'S',signal:[2,1,2,1,0,2],lines:[
'The scheduled messaging workflow remains active. Isolating the affected template is possible without shutting down the entire email service, but a full freeze will interrupt customer communications.',
'One forensic unit will retrieve the send log and approvals; a second will unlock deeper service-account traces. Without technical funding, the internal audit will be shallow.',
'The archive version was delivered by a service account, not a named employee. A disabled second-approval check is suspected but needs forensic confirmation.',
'Engineering can preserve customer delivery, but a dedicated service pod will remove technical staff from incident review. There is a real capacity trade-off.',
'The release workflow can be adjusted later. Systems has no new evidence about how employees will interpret the town-hall wording.',
'The scheduler still allows archived content to publish without renewed human approval. Fixing the approval gate materially reduces recurrence risk.']},
{n:'CLIENT RELATIONS',symbol:'C',signal:[1,1,1,2,1,0],lines:[
'The three clients are not asking for a blanket apology; they need to know whether named delivery owners are still responsible for their contracts.',
'An account manager can call affected clients today, but a client-response unit cannot replace the operational staff needed to deliver their work.',
'Two procurement contacts said an independent review would improve their confidence. However, they will still assess actual service continuity.',
'The largest customer can accept a measurable continuity plan. It will not accept an unlimited promise of unchanged staffing, because that is not credible.',
'Client contacts may see the town-hall statement later. If it promises more than the service team can deliver, the inconsistency will be noticed.',
'Procurement has not sent a new request today. The urgent board question concerns structural prevention rather than another client reassurance round.']},
{n:'FINANCE & RISK',symbol:'F',signal:[0,2,1,2,0,2],lines:[
'The emergency response has a £190k authorised envelope. Finance cannot yet estimate any extra reporting or compensation cost; today’s immediate question is who needs a response.',
'Two specialists in the same department yield less additional value than the first. Spending across several departments preserves flexibility, but may dilute impact.',
'An external investigation can cost substantially more than an internal review, particularly if forensics already collected the necessary logs.',
'Performance-linked credits could preserve a £240k renewal, but trigger extra cash loss if service falls below the agreed threshold.',
'Finance has no new facts about how employees will receive the words. Any support promise should eventually have a funded owner.',
'Only the unspent cash reserve can fund the final recovery. A broad programme may produce good metrics but create a liquidity crisis.']},
{n:'LEGAL & COMPLIANCE',symbol:'L',signal:[0,0,2,1,1,1],lines:[
'At this moment there is no verified basis to accuse a particular employee of deliberate wrongdoing. Counsel needs a preserved audit trail, not a rushed attribution.',
'Legal has not identified an imminent filing deadline that would determine how to split today’s five response units. Preserve records as standard practice.',
'An automatically sent file is not evidence of deliberate sabotage. The approval register and system logs support an investigation into control failures, not an accusation.',
'Contract wording distinguishes measurable service commitments from absolute guarantees of future staffing. Any new promise needs a specific owner and limit.',
'The company may describe a draft as unapproved, but must not make sweeping promises that restructuring will never occur. Say what is known, not what is convenient.',
'Before any final controls programme, assign an identifiable approval owner and preserve a record of who authorised release.']},
{n:'COMMUNICATIONS',symbol:'M',signal:[1,0,0,0,2,0],lines:[
'An early holding message can reduce rumours if it names the next update time; a polished but unverified statement risks corrections later.',
'Public coverage is still minimal. Communications can monitor rumours, but has no unique information about the relative cost of resource units.',
'No major journalist has contacted the organisation. Communications cannot verify who approved the file or what the audit log means.',
'Public sentiment is stabilising. The customer is evaluating service reliability and contract protections rather than media coverage.',
'A short opening statement can carry only two memorable commitments. Use plain language and specific next steps rather than generic brand promises.',
'Media attention is low. The board is assessing governance and funding; Communications has no newly verified detail on either.']}
];
const briefingSignal=roundIdx=>roles.map((r,i)=>({i,level:r.signal[roundIdx]}));
const briefingResult=(selected,roundIdx)=>{
 const chosen=selected.map(i=>roles[i]);const critical=chosen.filter(r=>r.signal[roundIdx]===2).length;
 const relevant=chosen.filter(r=>r.signal[roundIdx]>0).length;
 const missed=roles.filter((r,i)=>r.signal[roundIdx]===2&&!selected.includes(i)).map(r=>r.n);
 return {critical,relevant,missed,selected:chosen.map(r=>r.n)};
};

{title:'THE FIRST 20 MINUTES',time:'MON 09:17',story:'A confidential reorganisation proposal has gone to 600 employees and three clients. The CEO is on a flight. Staff demand clarification, legal wants a factual review, and a major client expects an answer within twenty minutes.',quote:'CEO (before take-off): “I trust everyone to act decisively. Preferably without creating another incident.”',kind:'choice',question:'What is the most defensible first move?',options:[
['Send a carefully qualified holding statement','Reassures people early, but may need correction.',{cash:-8,staff:10,client:3,evidence:0,service:-2,risk:7},'early','You communicate first. Later evidence will determine whether that trust holds.'],
['Isolate the mail workflow and investigate','Protects systems, but delays human communication.',{cash:-10,staff:-6,client:-2,evidence:12,service:-6,risk:-10},'contain','You contain the technical risk. Employees interpret the short silence differently.'],

['Create a staffed incident command room','Improves coordination at a considerable upfront cost.',{cash:-17,staff:4,client:3,evidence:8,service:-4,risk:-10},'command','Your response is organised, but some specialist capacity leaves normal delivery.'],
['Hold an urgent staff town hall','Provides voice and reassurance, but creates information risks.',{cash:-11,staff:14,client:-4,evidence:-1,service:-5,risk:8},'townhall','Employees appreciate access, but questions exceed what you can verify.'],

{title:'SIX FIRES, FIVE RESOURCES',time:'MON 11:10',story:'Calls are piling up. You have five emergency-response units to allocate across six areas, with a maximum of two per department. Funding one area leaves another exposed.',quote:'CFO: “All six departments have asked for priority status. That is mathematically fascinating.”',kind:'allocate',question:'Where will you spend your five response units?'},
{title:'THE APPROVAL PUZZLE',time:'MON 15:05',story:'Technical logs implicate a scheduled job. HR insists the attachment was never approved. The board wants to know whether this was an accident, a control failure or deliberate misconduct.',quote:'Systems lead: “The server log is a better witness than half the conference room.”',kind:'evidence',question:'How should the company investigate and establish accountability?',options:[
['Commission an independent forensic investigation','Credibility and rigour, with a sizeable cost and service disruption.',{cash:-28,staff:-2,client:8,evidence:21,service:-6,risk:-11},'external','Independent investigators begin work. The review is strong but expensive.'],
['Run a rapid internal forensic audit','Faster and cheaper, but its quality depends on earlier investment.',{cash:-11,staff:2,client:1,evidence:15,service:-3,risk:-6},'internal','Internal specialists review the logs. Their resources determine the depth.'],
['Secure all logs and defer the final verdict','Protects evidence and service, but prolongs public uncertainty.',{cash:-7,staff:-3,client:-4,evidence:12,service:5,risk:-4},'preserve','Evidence is protected, but employees still want a clear explanation.'],
['Invite an independent governance panel','Focuses on systemic control failures rather than only the technical root cause.',{cash:-20,staff:7,client:4,evidence:14,service:-7,risk:-12},'panel','The panel examines approval design and accountability.'],
['Offer a joint HR and IT investigation','Cross-functional knowledge, but internal independence remains questioned.',{cash:-12,staff:6,client:1,evidence:12,service:-4,risk:-5},'joint','Teams share context and move quickly, though the board asks about independence.'],
['Audit the approval process first, then commission targeted specialist review','Cheaper than a full external review but slower to reach a comprehensive verdict.',{cash:-17,staff:1,client:4,evidence:17,service:-5,risk:-9},'hybrid','You pursue a focused audit, preserving some funds for later recovery.']]},
{title:'THE £240,000 RENEWAL',time:'TUE 15:40',story:'Your largest client is due to renew. They want certainty their account team and project delivery will be unaffected. You cannot promise staffing decisions that have not been made.',quote:'Client director: “I don’t need motivational language. I need a credible delivery plan.”',kind:'choice',question:'What can you commit to without compromising the company?',options:[
['Create a protected continuity team','Protects service, but strains people and cash.',{cash:-24,staff:-6,client:16,evidence:0,service:7,risk:-3},'pod','You ring-fence customer delivery with a dedicated team.'],
['Offer performance-linked service credits','Appeals to procurement, but poor service could trigger future costs.',{cash:-12,staff:0,client:13,evidence:0,service:1,risk:5},'credits','The client accepts measurable financial remedies.'],
['Fund independent service assurance','Builds accountability; slower and costlier.',{cash:-30,staff:1,client:10,evidence:10,service:-4,risk:-11},'assurance','External reviewers assess service risks before the renewal.'],
['Publish a weekly service dashboard','Transparent and affordable, but makes any missed target visible.',{cash:-8,staff:3,client:7,evidence:4,service:-2,risk:6},'dashboard','The client agrees to review regular delivery evidence.'],
['Offer a jointly agreed revised delivery plan','Reduces overcommitment but may require accepting later milestones.',{cash:-9,staff:6,client:5,evidence:2,service:10,risk:-2},'replan','The client is disappointed but accepts transparent milestones.'],
['Offer senior executive sponsorship','Protects the relationship, but places leadership capacity on the account.',{cash:-16,staff:1,client:14,evidence:0,service:-5,risk:-1},'sponsor','A director personally owns the account’s recovery.']]},

{title:'THE BOARDROOM VERDICT',time:'FRI 16:30',story:'The board needs an actionable recovery package. Your company is bruised, cash is finite and some risks from earlier decisions are still unresolved. There is no universally optimal final plan.',quote:'CEO: “Excellent recovery meeting. Could we have fewer surprises next week?”',kind:'choice',question:'Where will you place the company’s recovery bet?',options:[
['Rebuild approval and audit controls','Strong risk reduction with cost to liquidity.',{cash:-27,staff:8,client:7,evidence:11,service:3,risk:-20},'controls','The approval process is redesigned and independently checked.'],

['Rebuild operational capacity','Improves delivery fastest, with high spending and limited investigative work.',{cash:-32,staff:5,client:8,evidence:1,service:16,risk:-11},'delivery','Projects stabilise, though some governance gaps remain.'],
['Fund a broad recovery programme','Balanced gains without maximum impact in any single dimension.',{cash:-35,staff:9,client:9,evidence:7,service:7,risk:-12},'balanced','The company commits to a broad but resource-intensive programme.'],
['Choose a staged 90-day governance programme','Preserves current liquidity, but allows risks to persist longer.',{cash:-14,staff:4,client:2,evidence:8,service:1,risk:-10},'staged','Cash is preserved, with safeguards rolled out over time.'],
['Protect key accounts while tightening critical approvals','Targets high-value customers and highest-risk processes, leaving some staff concerns.',{cash:-25,staff:1,client:15,evidence:8,service:8,risk:-13},'targeted','Key revenue and critical controls are protected, but staff see uneven support.']]}];

'A budget is also a statement of what the company is willing to leave exposed.',
'Investigation quality depends on both independence and actual capability.',

'Every public commitment requires people, evidence and a delivery mechanism.',
'The best final strategy depends on the problems you created or solved earlier.'];

const COLORS=['#65bdff','#ffa95b','#78d7bd','#c79ff0'];
const PORTRAITS=[2,3,4,1,5,0];

const START=260, OVERHEAD=[13,18,14,19,15,18], CLIENT_CONTRACT=240;
const TWISTS=[{name:'THE SCREENSHOT STORM',r:0,detail:'The leaked document is circulating outside the company before lunch.',delta:{staff:-6,client:-4,risk:7}},{name:'THE AUDIT BLACKOUT',r:2,detail:'A routine log rotation deleted part of the oldest audit history. Evidence must be reconstructed.',delta:{evidence:-7,service:-2,risk:5}},{name:'THE RENEWAL DEADLINE',r:3,detail:'Procurement moves the renewal meeting forward. The account team has less time to prove continuity.',delta:{client:-6,service:-4,risk:7}},{name:'THE STAFF CHAT REVOLT',r:4,detail:'Employees threaten a coordinated walkout unless someone answers their questions today.',delta:{staff:-8,service:-5,risk:8}}];
let pid=1;
const player=(name)=>({id:pid++,name});
let S={phase:'setup',variant:TWISTS[Math.floor(Math.random()*TWISTS.length)],count:2,players:['Alex','Giulia','Sam','Mara','Taylor','Jamie','Jordan','Priya'].map(player),teams:[],r:0,turn:0,picks:[],confirmed:false,choice:null,alloc:{},messages:[],docs:[],report:false};
const $=id=>document.getElementById(id);
const X=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const fresh=()=>({cash:START,staff:59,client:59,evidence:26,service:70,risk:49});
function newTeam(i){return {id:i,name:DEFAULTNAMES[i],members:[],mandate:mandates[i%4].id,m:fresh(),exposure:{legal:64,operational:52,staff:39,contract:47,financial:22},controls:0,ledger:[],flags:{},log:[],allocation:{},score:0,intel:0,commercial:'pending',last:'',events:[]}}
function resetTurn(){S.picks=[];S.confirmed=false;S.choice=null;S.messages=[];S.docs=[];S.alloc=Object.fromEntries(departments.map(d=>[d.id,0]));}
function fillTeams(shuffle=false){const old=S.teams;S.teams=Array.from({length:S.count},(_,i)=>{let t=newTeam(i);if(old[i]){t.name=old[i].name;t.mandate=old[i].mandate;}return t;});const pool=[...S.players];if(shuffle)for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}pool.forEach((p,i)=>S.teams[i%S.count].members.push(p));resetTurn();}
const briefing=(indexes,r)=>({relevant:indexes.filter(i=>roles[i].signal[r]>0).length,critical:indexes.filter(i=>roles[i].signal[r]===2).length,missed:roles.filter((a,i)=>a.signal[r]===2&&!indexes.includes(i)).map(a=>a.n)});
function ledgerEntry(t,reason,amount,r){t.m.cash-=amount;t.ledger.push({reason,amount,round:r});}
function financialRisk(cash){return clamp(18+(Math.max(0,70-cash)*.48)+(Math.max(0,-cash)*.56),14,100);}
function recomputeRisk(t){const m=t.m,f=t.flags;const legal=clamp(83-m.evidence*.54-t.controls*.85+(f.investigation==='preserve'?16:0)+(f.investigation==='external'?-9:0),10,98);
const ops=clamp(76-m.service*.69+(f.noOps?12:0)+(m.staff<48?12:0),9,98);
const people=clamp(72-m.staff*.60+(f.early==='clients'?12:0)+(f.noPeople?13:0),9,98);
const contract=clamp(83-m.client*.63+(m.service<55?17:0)+(f.deal==='credits'&&m.service<72?12:0),9,98);
const liquidity=financialRisk(m.cash);
t.exposure={legal:Math.round(legal),operational:Math.round(ops),staff:Math.round(people),contract:Math.round(contract),financial:Math.round(liquidity)};
m.risk=Math.round(clamp(legal*.31+ops*.21+people*.16+contract*.17+liquidity*.15,12,96));}
function change(t,d){for(const[k,v]of Object.entries(d)){if(k==='risk'){t.controls=clamp(t.controls-v*.8,-35,45);}else if(k==='cash'){if(v<0)ledgerEntry(t,'Strategic decision',-v,S.r);else{t.m.cash+=v;t.ledger.push({reason:'Financial recovery',amount:v*-1,round:S.r})}}else if(k in t.m)t.m[k]=clamp(t.m[k]+v,0,100);}recomputeRisk(t);}
function mandate(t){return mandates.find(x=>x.id===t.mandate)||mandates[0]}
function mandateMet(t){const m=t.m;return t.mandate==='staff'?m.staff>=74&&m.risk<=40:t.mandate==='client'?m.client>=75&&m.service>=65:t.mandate==='evidence'?m.evidence>=75&&m.risk<=33:m.cash>=45&&m.service>=65;}
function economics(t){const spent=t.ledger.filter(x=>x.amount>0).reduce((a,b)=>a+b.amount,0);const recovered=-t.ledger.filter(x=>x.amount<0).reduce((a,b)=>a+b.amount,0);return {spent,recovered,remaining:t.m.cash,overhead:t.ledger.filter(x=>x.reason==='Mandatory incident response').reduce((a,b)=>a+b.amount,0),choices:spent-t.ledger.filter(x=>x.reason==='Mandatory incident response').reduce((a,b)=>a+b.amount,0)};}
function scoreBreak(t){const m=t.m,e=economics(t),cashQuality=clamp(45+(m.cash-35)*.55,0,100);const operating=Math.round(.17*m.staff+.20*m.client+.15*m.evidence+.22*m.service+.16*(100-m.risk)+.10*cashQuality);const intelligence=Math.min(5,Math.round(t.intel*.40));const mandateBonus=mandateMet(t)?5:0;const penalty=e.remaining<0?Math.round(9+Math.min(24,Math.abs(e.remaining)*.31)):e.remaining<15?Math.round((15-e.remaining)*.25):0;const contractPenalty=t.commercial==='lost'?9:t.commercial==='at-risk'?4:0;const fragile=m.service<50?Math.round((50-m.service)*.3):0;const total=clamp(operating+intelligence+mandateBonus-penalty-contractPenalty-fragile,0,100);

t.intel+=br.critical*1.1+br.relevant*.2;t.log.push({round:r.title,choice,id,events,briefing:br,before:pre,after:{...t.m},changes:real,movement});t.events.push(...events);t.score=score(t);t.last=events[0]||`${choice} — every benefit came with a cost or a trade-off.`;
if(S.turn<S.teams.length-1){S.turn++;resetTurn();}else S.phase='recap';render();}
function recap(){page(`<main class="screen reveal"><div class="heading"><div><div class="eyebrow">END OF EPISODE ${S.r+1} · THE RECEIPTS</div><h1>THE FALLOUT</h1><p>The same emergency. Different priorities. The balance sheet remembers everything.</p></div><div class="roundtag">ROUND <b>0${S.r+1} / 06</b></div></div><div class="results">${S.teams.map(t=>{const l=t.log[S.r],overhead=t.ledger.filter(x=>x.round===S.r&&x.reason==='Mandatory incident response').reduce((a,b)=>a+b.amount,0),spent=l.before.cash-l.after.cash;return `<article class="result"><div class="ranking">${X(t.name)} / EPISODE ${S.r+1}</div><h3>${X(l.choice)}</h3><div class="finance"><span class="tiny">Cash this episode</span><strong>${spent>=0?'−':'+'}£${Math.abs(spent)}k</strong></div><div class="ledger"><div><span>Unavoidable incident cost</span><b>£${overhead}k</b></div><div><span>Strategic choices / liabilities</span><b>£${spent-overhead}k</b></div><div><span>Cash left to respond</span><b>£${t.m.cash}k</b></div><div><span>Residual risk</span><b>${t.m.risk}/100</b></div></div>${l.events.length?l.events.map(e=>`<p class="assessment">${X(e)}</p>`).join(''):'<p class="assessment">Your decision changed the state of the company. Its later effects may still emerge.</p>'}${metricsHTML(t)}<p class="tiny">Intelligence: ${l.briefing.relevant}/2 relevant consultations · ${l.briefing.critical}/2 critical insights</p></article>`}).join('')}</div><div class="panel" style="margin-top:18px"><div class="secLabel">THE TAKEAWAY</div><h2>WHAT JUST HAPPENED?</h2><p>${X(roundLessons[S.r])}</p><button class="primary" style="width:100%;margin-top:18px" data-act="next">${S.r===5?'ENTER THE BOARDROOM ↗':'NEXT EPISODE ↗'}</button></div></main>`);}
function final(){const all=[...S.teams].sort((a,b)=>b.score-a.score),best=all[0];page(`<main class="screen reveal"><div class="eyebrow">THE BOARDROOM VERDICT · 5 DAYS LATER</div><h1 style="font:900 clamp(66px,10vw,133px)/.85 var(--display);margin:15px 0">THE <span style="color:var(--hot)">VERDICT.</span></h1><p class="lede">There are winners. There are expensive winners. And then there are people Finance would like to speak to.</p><div class="panel" style="background:linear-gradient(115deg,#2b2419,#182637);border-color:#87663b;margin:24px 0"><div class="secLabel">BOARDROOM CHAMPION</div><div class="rankbig">${X(best.name)}</div><div class="finance"><strong>${best.score}/100</strong><span class="prize">${X(award(best))}</span></div><p>${X(businessOutcome(best)[1])}</p></div><div class="results">${all.map((t,i)=>{const e=economics(t),b=scoreBreak(t),analysis=narrative(t),r=businessOutcome(t);const rival=all.find(z=>z.id!==t.id);return `<article class="result ${i===0?'winner':''}"><div class="ranking">#${i+1} · ${X(t.name)}</div><div class="score">${t.score}<span class="tiny"> /100</span></div><span class="prize">${X(award(t))}</span><h3>${X(r[0])}</h3><p>${X(r[1])}</p><div class="finance"><strong>${e.remaining<0?'−':''}£${Math.abs(e.remaining)}k</strong><span class="tiny">cash left from £${START}k</span></div><div class="ledger"><div><span>Mandatory incident overhead</span><b>£${e.overhead}k</b></div><div><span>Chosen actions and liabilities</span><b>£${e.choices}k</b></div><div><span>Total cash spent</span><b>£${e.spent}k</b></div><div><span>Annual contract</span><b>${t.commercial==='renewed'?'PROTECTED':t.commercial==='lost'?'LOST':'AT RISK'}</b></div><div><span>Residual risk</span><b>${t.m.risk}/100</b></div><div><span>Strategic mandate</span><b>${mandateMet(t)?'ACHIEVED':'MISSED'}</b></div></div>${metricsHTML(t)}<div class="assessment"><b>THE BOARD'S ANALYSIS</b><div style="margin-top:8px">${analysis.map(s=>`<p>${X(s)}</p>`).join('')}</div><p><b>Against ${X(rival?.name||'the field')}:</b> ${X(juxtapose(t,rival))}</p></div><div class="ledger"><div><span>Operating performance</span><b>${b.operating}</b></div><div><span>Adviser intelligence</span><b>+${b.intelligence}</b></div><div><span>Strategic mandate</span><b>+${b.mandateBonus}</b></div><div><span>Liquidity / financial penalty</span><b>−${b.penalty}</b></div><div><span>Contract penalty</span><b>−${b.contractPenalty}</b></div><div><span>Unstable service penalty</span><b>−${b.fragile}</b></div></div><details style="margin-top:20px"><summary>SEE EVERY DECISION AND ITS CONSEQUENCES</summary><ol style="padding-left:22px">${t.log.map(x=>`<li style="margin:15px 0"><b>${X(x.round)}</b><br>${X(x.choice)}<p class="tiny">${x.events.map(X).join(' ')||'Outcome recorded in company indicators.'}</p></li>`).join('')}</ol></details></article>`}).join('')}</div><div class="panel" style="margin-top:18px"><div class="secLabel">WHAT ACTUALLY MATTERED</div><h2>THE RISK WAS NEVER JUST ONE NUMBER.</h2><p class="sub">Each team's composite risk was derived from five underlying exposures. Unlike the old version, a low legal risk cannot simply cancel out a cash crisis or collapsing service.</p>${all.map(t=>`<div style="margin-top:16px"><b>${X(t.name)}</b><div class="grid2" style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0">${Object.entries(t.exposure).map(([key,v])=>`<div class="metric"><small>${X(key)}</small><b>${v}</b></div>`).join('')}</div></div>`).join('')}</div><div class="twobuttons" style="margin-top:22px"><button class="primary" data-act="replay">PLAY AGAIN ↻</button><button class="secondary" data-act="report">${S.report?'HIDE REPORT':'COPYABLE REPORT'}</button></div>${S.report?`<div class="panel" style="margin-top:20px"><label class="fieldLabel">All decision trails and financial results</label><textarea readonly class="field" style="min-height:210px;font-size:12px">${X(reportText())}</textarea><button class="secondary" data-act="download">DOWNLOAD TEXT REPORT ↓</button></div>`:''}</main>`);}
function reportText(){return 'BUSINESS CRISIS / THE 09:17 INCIDENT · V0.8\n\n'+[...S.teams].sort((a,b)=>b.score-a.score).map(t=>{const e=economics(t);return `${t.name} — ${t.score} pts\n${businessOutcome(t).join(': ')}\nSpend: £${e.spent}k; cash left: £${e.remaining}k; risk: ${t.m.risk}\nContract: ${t.commercial}\n\n${narrative(t).join('\n\n')}\n\nDECISION HISTORY\n${t.log.map((l,i)=>`${i+1}. ${l.round}: ${l.choice}\n${l.events.join(' ')}`).join('\n\n')}`}).join('\n\n------\n\n');}
function render(){if(S.phase==='home')intro();else if(S.phase==='setup')setup();else if(S.phase==='brief')briefingPage();else if(S.phase==='turn')turn();else if(S.phase==='recap')recap();else if(S.phase==='final')final();}
function start(){S.phase='home';fillTeams();render()}
document.addEventListener('input',e=>{if(e.target.matches('[data-pid]')){let p=S.players.find(p=>p.id===Number(e.target.dataset.pid));if(p){p.name=e.target.value;const tp=S.teams.find(t=>t.members.some(x=>x.id===p.id));if(tp){let match=tp.members.find(x=>x.id===p.id);match.name=p.name;}}}else if(e.target.matches('[data-custom]')){S.teams[Number(e.target.dataset.custom)].name=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.id==='teamcount'){S.count=Number(e.target.value);fillTeams();render()}else if(e.target.matches('[data-tname]')){const t=S.teams[Number(e.target.dataset.tname)];t.name=e.target.value==='custom'?'MY TEAM':e.target.value;render()}else if(e.target.matches('[data-mandate]')){S.teams[Number(e.target.dataset.mandate)].mandate=e.target.value;render()}else if(e.target.matches('[data-move]')){const id=Number(e.target.dataset.move),dest=Number(e.target.value);let p=S.players.find(x=>x.id===id);for(const t of S.teams)t.members=t.members.filter(x=>x.id!==id);S.teams[dest].members.push(p);render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.closest('#app'))return;const a=b.dataset.act;
if(a==='setup')S.phase='setup';else if(a==='addPlayer'){S.players.push(player(''));fillTeams()}else if(b.hasAttribute('data-remove')){S.players=S.players.filter(p=>p.id!==Number(b.dataset.remove));fillTeams()}else if(a==='shuffle')fillTeams(true);else if(a==='brief'){if(S.teams.some(t=>!t.members.length))return;S.phase='brief'}else if(a==='start'){S.phase='turn';S.r=0;S.turn=0;resetTurn()}else if(b.hasAttribute('data-role')){const i=Number(b.dataset.role);if(S.picks.includes(i))S.picks=S.picks.filter(v=>v!==i);else if(S.picks.length<2)S.picks.push(i)}else if(a==='confirm'){if(S.picks.length===2)S.confirmed=true;}else if(b.hasAttribute('data-choice'))S.choice=Number(b.dataset.choice);else if(b.hasAttribute('data-doc')){const i=Number(b.dataset.doc);if(!S.docs.includes(i))S.docs.push(i)}else if(b.hasAttribute('data-message')){const i=Number(b.dataset.message);if(S.messages.includes(i))S.messages=S.messages.filter(v=>v!==i);else if(S.messages.length<2)S.messages.push(i)}else if(b.hasAttribute('data-budget')){const id=b.dataset.budget,v=Number(b.dataset.inc);if(v>0&&(sum(S.alloc)>=5||S.alloc[id]>=2))return;S.alloc[id]=clamp(S.alloc[id]+v,0,2)}else if(a==='lock'){resolve();return}else if(a==='next'){if(S.r===5)S.phase='final';else{S.r++;S.turn=0;resetTurn();S.phase='turn'}}else if(a==='replay'){S.teams=S.teams.map(old=>{const t=newTeam(old.id);t.name=old.name;t.mandate=old.mandate;t.members=[...old.members];return t;});S.r=0;S.turn=0;resetTurn();S.variant=TWISTS[(TWISTS.indexOf(S.variant)+1+Math.floor(Math.random()*(TWISTS.length-1)))%TWISTS.length];S.phase='brief';S.report=false}else if(a==='report')S.report=!S.report;else if(a==='download'){const blob=new Blob([reportText()],{type:'text/plain'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='business-crisis-verdict.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),500);return;}render();});
start();
</script></body></html>
