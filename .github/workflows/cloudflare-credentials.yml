# Credential preflight only. Does not deploy, publish, or modify any Cloudflare resource.
# After changing secrets, start a NEW run; reruns may retain the original secret snapshot.
name: Cloudflare credentials preflight (read-only)

on:
  push:
    branches:
      - redesign/cinematic-crisis-v2
    paths:
      - .github/workflows/cloudflare-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm Cloudflare Workers access (no deploy)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID has no value. Set it in repository Actions secrets."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN has no value. Set it in repository Actions secrets."
            exit 1
          fi
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare account ID."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")" || {
            echo "::error::Unable to reach Cloudflare API for the read-only check."
            exit 1
          }

          if [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare read-only Workers check returned HTTP $status. Verify account ID and token permissions."
            exit 1
          fi
          if ! jq -e '.success == true and (.result | type == "array")' "$response_file" >/dev/null; then
            echo "::error::Cloudflare did not confirm access to Workers scripts for this account."
            exit 1
          fi

          echo "Cloudflare Workers API read access confirmed. No deploy performed."
